<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SONIC BOOM 💥🔵⚡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',sans-serif;touch-action:none;user-select:none}
canvas{display:block}
#ui-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#score-display{position:absolute;top:15px;right:20px;color:#fff;font-size:22px;font-weight:900;text-shadow:0 0 15px #00bfff,0 0 30px #0066ff;pointer-events:none}
#score-display span{color:#00e5ff;font-size:28px}
#lives-display{position:absolute;top:15px;left:20px;color:#ff4081;font-size:24px;text-shadow:0 0 10px #ff4081;pointer-events:none}
#combo-display{position:absolute;top:55px;right:20px;color:#ffd740;font-size:18px;font-weight:bold;text-shadow:0 0 10px #ffd740;opacity:0;transition:opacity 0.3s;pointer-events:none}
#speed-display{position:absolute;bottom:20px;right:20px;color:#76ff03;font-size:16px;text-shadow:0 0 8px #76ff03;pointer-events:none}
#start-screen,#game-over-screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;pointer-events:all}
#start-screen{background:radial-gradient(ellipse at center,#0d1b3e 0%,#050a1a 70%)}
#game-over-screen{background:rgba(5,5,20,0.92);display:none}
.title-text{font-size:clamp(42px,8vw,72px);font-weight:900;background:linear-gradient(135deg,#00bfff,#0066ff,#7c4dff,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;letter-spacing:4px;animation:titlePulse 2s ease-in-out infinite}
@keyframes titlePulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.05);filter:brightness(1.3)}}
.subtitle{color:#b0bec5;font-size:clamp(14px,3vw,20px);margin:10px 0 30px;text-align:center;max-width:80%}
.btn-play{background:linear-gradient(135deg,#0066ff,#00bfff);color:#fff;border:none;padding:16px 48px;font-size:22px;font-weight:900;border-radius:50px;cursor:pointer;letter-spacing:2px;box-shadow:0 0 30px rgba(0,102,255,0.5),0 8px 25px rgba(0,0,0,0.4);transition:all 0.3s;pointer-events:all}
.btn-play:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 0 50px rgba(0,191,255,0.7)}
.btn-play:active{transform:scale(0.95)}
#final-score{color:#00e5ff;font-size:48px;font-weight:900;text-shadow:0 0 20px #00bfff}
#final-label{color:#90a4ae;font-size:18px;margin-bottom:5px}
#high-score-label{color:#ffd740;font-size:20px;margin:10px 0 25px;text-shadow:0 0 10px #ffd740}
.controls-hint{color:#546e7a;font-size:13px;margin-top:20px;text-align:center}
#mobile-controls{position:fixed;bottom:0;left:0;width:100%;display:none;justify-content:space-between;padding:15px 20px;z-index:50;pointer-events:all}
.mobile-btn{width:70px;height:70px;border-radius:50%;border:3px solid rgba(0,191,255,0.5);background:rgba(0,30,80,0.6);color:#00e5ff;font-size:28px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);cursor:pointer;transition:all 0.15s}
.mobile-btn:active{background:rgba(0,102,255,0.7);transform:scale(0.9);border-color:#00e5ff}
#dash-btn{background:rgba(100,0,150,0.6);border-color:rgba(124,77,255,0.5);color:#e040fb}
#dash-btn:active{background:rgba(124,77,255,0.7);border-color:#e040fb}
.flash-effect{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,191,255,0.15);z-index:5;pointer-events:none;opacity:0;transition:opacity 0.1s}
@media(max-width:768px){#mobile-controls{display:flex !important}}
</style>
</head>
<body>

<div id="start-screen">
  <div class="title-text">SONIC BOOM</div>
  <div class="subtitle">اركض بسرعة الصوت 💥 اقفز فوق العوائق 🔵 اجمع الحلقات الذهبية ⚡ واهزم الروبوتات!</div>
  <button class="btn-play" id="btn-start">🚀 ابدأ المغامرة</button>
  <div class="controls-hint">⌨️ مسافة / ↑ = قفز &nbsp;|&nbsp; Shift = داش &nbsp;|&nbsp; ↓ = انزلاق<br>📱 أزرار اللمس للموبايل</div>
</div>

<div id="game-over-screen">
  <div id="final-label">النتيجة النهائية</div>
  <div id="final-score">0</div>
  <div id="high-score-label">🏆 أعلى نتيجة: 0</div>
  <button class="btn-play" id="btn-restart">🔄 حاول مرة أخرى</button>
</div>

<div id="ui-overlay">
  <div id="score-display">النقاط: <span id="score-val">0</span></div>
  <div id="lives-display" id="lives-val">❤️❤️❤️</div>
  <div id="combo-display" id="combo-val">🔥 x1</div>
  <div id="speed-display">⚡ السرعة: <span id="speed-val">1.0x</span></div>
</div>

<div class="flash-effect" id="flash"></div>

<div id="mobile-controls">
  <button class="mobile-btn" id="slide-btn">⬇️</button>
  <button class="mobile-btn" id="jump-btn">⬆️</button>
  <button class="mobile-btn" id="dash-btn">💨</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Game State
const STATE = { MENU: 0, PLAYING: 1, OVER: 2 };
let state = STATE.MENU;
let score = 0, highScore = parseInt(localStorage.getItem('sonic_boom_hs') || '0');
let lives = 3, combo = 0, maxCombo = 0;
let speed = 6, baseSpeed = 6, maxSpeed = 18;
let frameCount = 0, lastTime = 0, dt = 0;
let shakeX = 0, shakeY = 0, shakeDur = 0;
let invincible = 0;
let dashCooldown = 0, dashActive = 0;
let groundY;

// Player
const player = {
  x: 120, y: 0, vy: 0, w: 50, h: 55,
  grounded: true, sliding: false, jumping: false,
  color: '#00bfff', trail: [],
  jumpPower: -16, gravity: 0.7,
  doubleJump: true, hasDoubleJumped: false
};

// Arrays
let obstacles = [], rings = [], particles = [], bgLayers = [], enemies = [], powerups = [];
let starsBg = [];

// Generate stars
for (let i = 0; i < 120; i++) {
  starsBg.push({ x: Math.random() * 2000, y: Math.random() * 600, s: Math.random() * 2.5 + 0.5, b: Math.random() });
}

// BG Layers (parallax)
function initBG() {
  bgLayers = [
    { color: '#0d1b3e', speed: 0.1, hills: [] },
    { color: '#142952', speed: 0.3, hills: [] },
    { color: '#1a3a6a', speed: 0.5, hills: [] }
  ];
  bgLayers.forEach(l => {
    for (let i = 0; i < 8; i++) {
      l.hills.push({ x: i * 300, w: 300 + Math.random() * 200, h: 80 + Math.random() * 120 });
    }
  });
}
initBG();

// Spawn obstacle
function spawnObstacle() {
  const types = ['spike', 'crate', 'tall_crate', 'gap', 'flying'];
  const t = types[Math.floor(Math.random() * types.length)];
  let o = { x: W + 50, type: t, passed: false };
  switch(t) {
    case 'spike': o.w = 35; o.h = 40; o.y = groundY - 40; o.color = '#ff1744'; break;
    case 'crate': o.w = 45; o.h = 45; o.y = groundY - 45; o.color = '#8d6e63'; break;
    case 'tall_crate': o.w = 40; o.h = 80; o.y = groundY - 80; o.color = '#6d4c41'; break;
    case 'gap': o.w = 80 + speed * 5; o.h = 200; o.y = groundY; o.color = '#1a1a2e'; break;
    case 'flying': o.w = 50; o.h = 30; o.y = groundY - 120 - Math.random() * 60; o.color = '#e53935'; break;
  }
  obstacles.push(o);
}

// Spawn ring
function spawnRing() {
  const patterns = ['line', 'arc', 'wave'];
  const p = patterns[Math.floor(Math.random() * patterns.length)];
  const count = 3 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    let rx = W + 60 + i * 45;
    let ry;
    switch(p) {
      case 'line': ry = groundY - 60 - Math.random() * 30; break;
      case 'arc': ry = groundY - 40 - Math.sin(i / count * Math.PI) * 120; break;
      case 'wave': ry = groundY - 80 - Math.sin(i * 0.8) * 50; break;
    }
    rings.push({ x: rx, y: ry, r: 14, collected: false, glow: Math.random() });
  }
}

// Spawn enemy robot
function spawnEnemy() {
  const y = groundY - 50;
  enemies.push({
    x: W + 50, y: y, w: 45, h: 50,
    color: '#e53935', eyeColor: '#ffd740',
    alive: true, bobPhase: Math.random() * Math.PI * 2
  });
}

// Particles
function addParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * spread,
      vy: (Math.random() - 0.8) * spread,
      life: 1, decay: 0.02 + Math.random() * 0.03,
      size: 2 + Math.random() * 4, color
    });
  }
}

// Flash
function flash(color) {
  const el = document.getElementById('flash');
  el.style.background = color || 'rgba(0,191,255,0.15)';
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 80);
}

// Screen shake
function shake(dur, mag) { shakeDur = dur; shakeX = (Math.random()-0.5)*mag; shakeY = (Math.random()-0.5)*mag; }

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'ArrowUp') && state === STATE.PLAYING) doJump();
  if (e.code === 'ArrowDown' && state === STATE.PLAYING) doSlide();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') doDash();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ArrowDown') player.sliding = false;
});

// Touch
document.getElementById('jump-btn').addEventListener('touchstart', e => { e.preventDefault(); doJump(); });
document.getElementById('slide-btn').addEventListener('touchstart', e => { e.preventDefault(); doSlide(); });
document.getElementById('slide-btn').addEventListener('touchend', e => { player.sliding = false; });
document.getElementById('dash-btn').addEventListener('touchstart', e => { e.preventDefault(); doDash(); });

// Swipe
let touchStartY = 0;
canvas.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (dy > 40) doJump();
  else if (dy < -40) doSlide();
});

function doJump() {
  if (state !== STATE.PLAYING) return;
  if (player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
    player.jumping = true;
    player.hasDoubleJumped = false;
    addParticles(player.x, player.y + player.h, '#00bfff', 6, 5);
  } else if (!player.hasDoubleJumped && player.doubleJump) {
    player.vy = player.jumpPower * 0.85;
    player.hasDoubleJumped = true;
    addParticles(player.x, player.y + player.h/2, '#7c4dff', 8, 6);
  }
}

function doSlide() {
  if (state !== STATE.PLAYING) return;
  if (player.grounded) {
    player.sliding = true;
    setTimeout(() => player.sliding = false, 500);
  }
}

function doDash() {
  if (state !== STATE.PLAYING || dashCooldown > 0) return;
  dashActive = 20;
  dashCooldown = 120;
  flash('rgba(124,77,255,0.3)');
  shake(8, 3);
  addParticles(player.x, player.y + player.h/2, '#e040fb', 15, 8);
}

// Start game
function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; combo = 0; maxCombo = 0;
  speed = baseSpeed; frameCount = 0; invincible = 0;
  dashCooldown = 0; dashActive = 0;
  player.y = groundY - player.h;
  player.vy = 0; player.grounded = true;
  player.sliding = false; player.trail = [];
  obstacles = []; rings = []; enemies = [];
  particles = []; powerups = [];
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'none';
  updateUI();
}

function gameOver() {
  state = STATE.OVER;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('sonic_boom_hs', highScore.toString());
  }
  document.getElementById('final-score').textContent = score;
  document.getElementById('high-score-label').textContent = '🏆 أعلى نتيجة: ' + highScore;
  document.getElementById('game-over-screen').style.display = 'flex';
  shake(20, 8);
  flash('rgba(255,23,68,0.4)');
}

function updateUI() {
  document.getElementById('score-val').textContent = score;
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '❤️';
  document.getElementById('lives-display').textContent = hearts;
  const comboEl = document.getElementById('combo-display');
  if (combo > 1) {
    comboEl.textContent = '🔥 x' + combo;
    comboEl.style.opacity = '1';
  } else {
    comboEl.style.opacity = '0';
  }
  document.getElementById('speed-val').textContent = (speed / baseSpeed).toFixed(1) + 'x';
}

function hitPlayer() {
  if (invincible > 0 || dashActive > 0) return;
  lives--;
  combo = 0;
  invincible = 90;
  shake(15, 6);
  flash('rgba(255,23,68,0.3)');
  addParticles(player.x + player.w/2, player.y + player.h/2, '#ff1744', 20, 10);
  if (lives <= 0) gameOver();
  updateUI();
}

function collectRing(ring) {
  ring.collected = true;
  score += 10 * (1 + Math.floor(combo / 5));
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  addParticles(ring.x, ring.y, '#ffd740', 8, 5);
  flash('rgba(255,215,64,0.1)');
  updateUI();
}

function destroyEnemy(enemy) {
  enemy.alive = false;
  score += 50;
  combo += 3;
  addParticles(enemy.x + enemy.w/2, enemy.y + enemy.h/2, '#ff6d00', 20, 10);
  shake(10, 4);
  flash('rgba(255,109,0,0.2)');
  updateUI();
}

// Collision
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// BUTTON EVENTS
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// Main Loop
function update(ts) {
  requestAnimationFrame(update);
  dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;
  groundY = H - 100;

  if (state !== STATE.PLAYING) {
    drawBG();
    return;
  }

  frameCount++;

  // Speed ramp
  if (frameCount % 300 === 0 && speed < maxSpeed) speed += 0.3;

  // Spawn
  if (frameCount % Math.max(40, 90 - Math.floor(speed * 2)) === 0) spawnObstacle();
  if (frameCount % 60 === 0) spawnRing();
  if (frameCount % Math.max(80, 200 - Math.floor(speed * 5)) === 0) spawnEnemy();

  // Cooldowns
  if (invincible > 0) invincible--;
  if (dashCooldown > 0) dashCooldown--;
  if (dashActive > 0) dashActive--;
  if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = 0; shakeY = 0; }

  // Player physics
  const pH = player.sliding ? 30 : player.h;
  player.vy += player.gravity * dt;
  player.y += player.vy * dt;

  if (player.y + pH >= groundY) {
    player.y = groundY - pH;
    player.vy = 0;
    player.grounded = true;
    player.jumping = false;
    player.hasDoubleJumped = false;
  } else {
    player.grounded = false;
  }

  // Trail
  player.trail.push({ x: player.x + player.w/2, y: player.y + pH/2, life: 1 });
  if (player.trail.length > 20) player.trail.shift();
  player.trail.forEach(t => t.life -= 0.05);

  const currentSpeed = dashActive > 0 ? speed * 2.2 : speed;

  // Obstacles
  obstacles.forEach(o => {
    o.x -= currentSpeed * dt;
    if (o.type !== 'gap') {
      const pRect = { x: player.x + 5, y: player.y, w: player.w - 10, h: pH };
      if (rectsOverlap(pRect, o)) {
        if (dashActive > 0) {
          addParticles(o.x, o.y, '#e040fb', 15, 8);
          o.x = -200;
          score += 25;
        } else {
          hitPlayer();
        }
      }
    } else {
      if (player.grounded && player.x + player.w > o.x + 10 && player.x < o.x + o.w - 10) {
        hitPlayer();
      }
    }
    if (!o.passed && o.x + o.w < player.x) { o.passed = true; score += 5; updateUI(); }
  });
  obstacles = obstacles.filter(o => o.x > -200);

  // Rings
  rings.forEach(r => {
    r.x -= currentSpeed * dt;
    r.glow += 0.05;
    if (!r.collected) {
      const dx = (player.x + player.w/2) - r.x;
      const dy = (player.y + pH/2) - r.y;
      if (Math.sqrt(dx*dx + dy*dy) < r.r + 20) collectRing(r);
    }
  });
  rings = rings.filter(r => r.x > -50 && !r.collected);

  // Enemies
  enemies.forEach(en => {
    en.x -= currentSpeed * dt * 0.8;
    en.bobPhase += 0.05;
    if (en.alive) {
      const pRect = { x: player.x + 5, y: player.y, w: player.w - 10, h: pH };
      const eRect = { x: en.x, y: en.y, w: en.w, h: en.h };
      if (rectsOverlap(pRect, eRect)) {
        if (player.vy > 0 && player.y + pH < en.y + en.h * 0.6) {
          destroyEnemy(en);
          player.vy = player.jumpPower * 0.7;
        } else if (dashActive > 0) {
          destroyEnemy(en);
        } else {
          hitPlayer();
        }
      }
    }
  });
  enemies = enemies.filter(e => e.x > -100);

  // Particles
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.15;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);

  // Score tick
  if (frameCount % 10 === 0) { score++; updateUI(); }

  // Draw
  draw(pH);
}

function drawBG() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#050a1a');
  skyGrad.addColorStop(0.5, '#0d1b3e');
  skyGrad.addColorStop(1, '#1a3a6a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  starsBg.forEach(s => {
    const brightness = 0.3 + Math.sin(frameCount * 0.02 + s.b * 10) * 0.3;
    ctx.globalAlpha = brightness;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x % W, s.y % (H * 0.6), s.s, s.s);
  });
  ctx.globalAlpha = 1;

  // Parallax hills
  bgLayers.forEach(layer => {
    ctx.fillStyle = layer.color;
    layer.hills.forEach(hill => {
      const hx = ((hill.x - frameCount * layer.speed * (state === STATE.PLAYING ? speed * 0.3 : 0.5)) % (W + 500)) - 250;
      ctx.beginPath();
      ctx.moveTo(hx, H);
      ctx.quadraticCurveTo(hx + hill.w/2, H - hill.h, hx + hill.w, H);
      ctx.fill();
    });
  });

  // Ground
  groundY = H - 100;
  const gGrad = ctx.createLinearGradient(0, groundY, 0, H);
  gGrad.addColorStop(0, '#1b5e20');
  gGrad.addColorStop(0.3, '#2e7d32');
  gGrad.addColorStop(1, '#1a3a1a');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Ground line
  ctx.strokeStyle = '#4caf50';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  // Grid lines on ground
  ctx.strokeStyle = 'rgba(76,175,80,0.2)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 40) {
    const offset = (frameCount * (state === STATE.PLAYING ? speed : 1) * 0.5) % 40;
    ctx.beginPath();
    ctx.moveTo(gx - offset, groundY);
    ctx.lineTo(gx - offset - 30, H);
    ctx.stroke();
  }
}

function draw(pH) {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBG();

  const currentSpeed = dashActive > 0 ? speed * 2.2 : speed;

  // Obstacles
  obstacles.forEach(o => {
    if (o.type === 'gap') return;
    ctx.save();
    if (o.type === 'spike') {
      ctx.fillStyle = '#ff1744';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.h);
      ctx.lineTo(o.x + o.w/2, o.y);
      ctx.lineTo(o.x + o.w, o.y + o.h);
      ctx.fill();
      ctx.fillStyle = '#ff5252';
      ctx.beginPath();
      ctx.moveTo(o.x + o.w*0.2, o.y + o.h);
      ctx.lineTo(o.x + o.w/2, o.y + o.h*0.3);
      ctx.lineTo(o.x + o.w*0.8, o.y + o.h);
      ctx.fill();
    } else if (o.type === 'flying') {
      ctx.fillStyle = '#e53935';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = '#ff8a80';
      ctx.fillRect(o.x + 5, o.y + 5, o.w - 10, 8);
      // Propeller
      const propW = 30 + Math.sin(frameCount * 0.3) * 15;
      ctx.fillStyle = '#90a4ae';
      ctx.fillRect(o.x + o.w/2 - propW/2, o.y - 5, propW, 4);
    } else {
      ctx.fillStyle = o.color;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      // Cross pattern for crates
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y + o.h);
      ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x, o.y + o.h);
      ctx.stroke();
    }
    ctx.restore();
  });

  // Rings
  rings.forEach(r => {
    if (r.collected) return;
    ctx.save();
    ctx.translate(r.x, r.y);
    // Glow
    ctx.shadowColor = '#ffd740';
    ctx.shadowBlur = 12 + Math.sin(r.glow) * 5;
    // Outer ring
    ctx.strokeStyle = '#ffd740';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r.r, 0, Math.PI * 2);
    ctx.stroke();
    // Inner ring
    ctx.strokeStyle = '#ffecb3';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r.r - 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  });

  // Enemies
  enemies.forEach(en => {
    if (!en.alive) return;
    ctx.save();
    const bob = Math.sin(en.bobPhase) * 3;
    ctx.translate(en.x, en.y + bob);
    // Body
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.arc(en.w/2, en.h/2, en.w/2, 0, Math.PI * 2);
    ctx.fill();
    // Eye
    ctx.fillStyle = en.eyeColor;
    ctx.beginPath();
    ctx.arc(en.w * 0.35, en.h * 0.35, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(en.w * 0.65, en.h * 0.35, 6, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#b71c1c';
    ctx.beginPath();
    ctx.arc(en.w * 0.35, en.h * 0.35, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(en.w * 0.65, en.h * 0.35, 3, 0, Math.PI * 2);
    ctx.fill();
    // Antenna
    ctx.strokeStyle = '#90a4ae';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(en.w/2, 0);
    ctx.lineTo(en.w/2, -12);
    ctx.stroke();
    ctx.fillStyle = '#ff1744';
    ctx.beginPath();
    ctx.arc(en.w/2, -14, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Player trail
  player.trail.forEach((t, i) => {
    if (t.life <= 0) return;
    ctx.globalAlpha = t.life * 0.4;
    ctx.fillStyle = dashActive > 0 ? '#e040fb' : '#00bfff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 8 * t.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Player
  ctx.save();
  ctx.translate(player.x, player.y);
  const alpha = invincible > 0 ? (Math.sin(frameCount * 0.5) > 0 ? 1 : 0.3) : 1;
  ctx.globalAlpha = alpha;

  if (dashActive > 0) {
    ctx.shadowColor = '#e040fb';
    ctx.shadowBlur = 25;
  } else {
    ctx.shadowColor = '#00bfff';
    ctx.shadowBlur = 15;
  }

  if (player.sliding) {
    // Sliding pose
    ctx.fillStyle = dashActive > 0 ? '#9c27b0' : '#0066ff';
    ctx.fillRect(0, pH - 20, player.w + 10, 20);
    ctx.fillStyle = dashActive > 0 ? '#e040fb' : '#00bfff';
    ctx.beginPath();
    ctx.arc(player.w/2, pH - 15, 12, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Body (hedgehog shape)
    ctx.fillStyle = dashActive > 0 ? '#9c27b0' : '#0066ff';
    ctx.beginPath();
    ctx.ellipse(player.w/2, pH * 0.55, player.w/2, pH * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head
    ctx.fillStyle = dashActive > 0 ? '#e040fb' : '#00bfff';
    ctx.beginPath();
    ctx.arc(player.w/2, pH * 0.3, 16, 0, Math.PI * 2);
    ctx.fill();
    // Spikes
    const spikeColor = dashActive > 0 ? '#7c4dff' : '#0d47a1';
    ctx.fillStyle = spikeColor;
    for (let s = 0; s < 4; s++) {
      ctx.save();
      ctx.translate(player.w * 0.2, pH * 0.25);
      ctx.rotate(-0.3 - s * 0.25 + Math.sin(frameCount * 0.1) * 0.05);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-8, -18 - s * 3);
      ctx.lineTo(6, -5);
      ctx.fill();
      ctx.restore();
    }
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.w * 0.6, pH * 0.25, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a237e';
    ctx.beginPath();
    ctx.arc(player.w * 0.62, pH * 0.25, 3, 0, Math.PI * 2);
    ctx.fill();
    // Shoe
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(player.w * 0.15, pH - 12, 18, 12);
    ctx.fillRect(player.w * 0.55, pH - 12, 18, 12);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

// Start animation loop
requestAnimationFrame(update);
</script>
</body>
</html>
