<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LexiCode 🔤🟩🟨</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>LexiCode 🔤🟩🟨</h1>
            <div class="stats-btn" id="stats-btn">📊 الإحصائيات</div>
        </header>

        <div id="board" class="board">
            <!-- 6 rows x 5 columns will be generated by JS -->
        </div>

        <div id="keyboard" class="keyboard">
            <!-- Keyboard rows generated by JS -->
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <button class="close-btn" id="close-modal">✖</button>
            <h2 id="modal-title"></h2>
            <div id="modal-content"></div>
            <button class="action-btn" id="play-again-btn" style="display:none;">لعب مرة أخرى</button>
        </div>
    </div>

    <!-- Toast for errors -->
    <div id="toast" class="toast hidden"></div>

    <script src="game.js"></script>
</body>
</html>
