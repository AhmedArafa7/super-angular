<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أونو المجنونة 🎴 - Crazy UNO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-card: #ef4444;
            --blue-card: #3b82f6;
            --green-card: #22c55e;
            --yellow-card: #eab308;
            --black-card: #1e293b;
            --white-card: #ffffff;
            --bg-table: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', system-ui, sans-serif;
            background: var(--bg-table);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- SETUP MODAL SCREEN --- */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        #setup-screen h1 {
            font-size: 3.2rem;
            font-weight: 900;
            color: #facc15;
            margin: 0 0 10px 0;
            text-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
        }

        #setup-screen p {
            color: #cbd5e1;
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 14px 28px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
        }

        .player-count-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .count-btn {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }
        .count-btn.active {
            background: #facc15;
            color: #0f172a;
            border-color: #fef08a;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
        }

        /* --- GAME TABLE AREA --- */
        #game-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100vh;
            width: 100vw;
        }

        /* Top & Side Opponent Bar */
        .opponents-bar {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            z-index: 20;
        }

        .opp-card-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .opp-card-badge.active-turn {
            border-color: #facc15;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
            transform: scale(1.08);
            background: rgba(30, 41, 59, 0.95);
        }

        .opp-avatar {
            font-size: 1.5rem;
        }

        .opp-info {
            text-align: right;
        }

        .opp-name {
            font-size: 0.85rem;
            font-weight: 900;
            color: #f8fafc;
        }

        .opp-cards-count {
            font-size: 0.75rem;
            color: #facc15;
            font-weight: bold;
        }

        /* Central Playing Field */
        .center-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .direction-indicator {
            position: absolute;
            top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 900;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .deck-discard-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 15px 0;
        }

        /* CARD VISUALS */
        .uno-card {
            width: 105px;
            height: 155px;
            border-radius: 16px;
            border: 5px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
            overflow: hidden;
            background: #ffffff;
        }

        .uno-card:hover:not(.disabled) {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 50;
        }

        /* Card Colors */
        .uno-card.red { background: var(--red-card); }
        .uno-card.blue { background: var(--blue-card); }
        .uno-card.green { background: var(--green-card); }
        .uno-card.yellow { background: var(--yellow-card); }
        .uno-card.wild { background: linear-gradient(135deg, #0f172a, #334155); }
        .uno-card.white_crazy { 
            background: linear-gradient(135deg, #ffffff, #e2e8f0); 
            border-color: #f59e0b;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), inset 0 0 15px rgba(245, 158, 11, 0.3);
        }

        /* Inner Oval Graphic */
        .card-inner-oval {
            width: 82%;
            height: 82%;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50% / 40%;
            transform: rotate(-25deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
        }
        .uno-card.wild .card-inner-oval {
            background: conic-gradient(var(--red-card) 0deg 90deg, var(--blue-card) 90deg 180deg, var(--green-card) 180deg 270deg, var(--yellow-card) 270deg 360deg);
        }
        .uno-card.white_crazy .card-inner-oval {
            background: rgba(245, 158, 11, 0.15);
            border: 2px dashed #f59e0b;
        }

        /* Card Symbols & Text */
        .card-symbol {
            position: relative;
            z-index: 5;
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 3px 8px rgba(0,0,0,0.5);
            transform: rotate(0deg);
        }
        .uno-card.white_crazy .card-symbol {
            color: #0f172a;
            text-shadow: none;
        }

        .card-corner {
            position: absolute;
            font-size: 0.85rem;
            font-weight: 900;
            color: white;
            line-height: 1;
        }
        .card-corner.top-left { top: 6px; left: 8px; }
        .card-corner.bottom-right { bottom: 6px; right: 8px; transform: rotate(180deg); }
        .uno-card.white_crazy .card-corner { color: #0f172a; }

        /* Card Back (Deck) */
        .uno-card.deck-back {
            background: #0f172a;
            border-color: #ffffff;
        }
        .uno-card.deck-back .deck-logo {
            transform: rotate(-30deg);
            font-size: 1.6rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            background: #ef4444;
            padding: 4px 12px;
            border-radius: 999px;
            border: 2px solid white;
        }

        /* Turn Indicator Status Banner */
        .turn-status-banner {
            font-size: 1.3rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-top: 10px;
        }

        /* Current Active Color Indicator Badge */
        .active-color-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }
        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
        }

        /* --- PLAYER HAND AREA --- */
        .player-hand-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.7);
            border-top: 2px solid rgba(255,255,255,0.1);
            padding: 15px 20px 25px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-height: 170px;
            z-index: 30;
        }

        .cards-fan {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 0 40px;
        }

        .cards-fan .uno-card {
            margin-left: -45px;
            box-shadow: -8px 0 15px rgba(0,0,0,0.4);
        }
        .cards-fan .uno-card:first-child {
            margin-left: 0;
        }

        /* UNO CALL BUTTON */
        #btn-uno {
            position: absolute;
            left: 30px;
            top: -30px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: 3px solid #facc15;
            padding: 12px 26px;
            border-radius: 999px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
            transition: all 0.2s ease;
            z-index: 40;
        }
        #btn-uno:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
        }
        #btn-uno.pulse-uno {
            animation: pulseUno 0.8s infinite alternate;
        }
        @keyframes pulseUno {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
            to { transform: scale(1.12); box-shadow: 0 0 30px rgba(250, 204, 21, 0.9); }
        }

        /* --- COLOR PICKER DIALOG --- */
        #color-picker-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #color-picker-modal h2 {
            color: #facc15;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
        }

        .color-orbs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .color-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .color-orb:hover {
            transform: scale(1.15);
        }
        .color-orb.red { background: var(--red-card); }
        .color-orb.blue { background: var(--blue-card); }
        .color-orb.green { background: var(--green-card); }
        .color-orb.yellow { background: var(--yellow-card); }

        /* --- TOAST NOTIFICATIONS --- */
        .toast {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            color: #facc15;
            border: 2px solid #facc15;
            padding: 16px 36px;
            border-radius: 999px;
            font-size: 1.4rem;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -40%);
        }
    </style>
</head>
<body>

    <!-- 1. SETUP MODAL -->
    <div id="setup-screen">
        <h1>أونو المجنونة 🎴</h1>
        <p>
            النسخة الخارقة والمثيرة من لعبة الكروت الشهيرة! <br>
            تتضمن بطاقات التبديل 🔄، الإلغاء 🚫، +2️⃣، +4️⃣، و<strong>البطاقات البيضاء الخارقة 💥 (+5 لجميع الخصوم)</strong>!
        </p>

        <div style="margin-bottom: 15px; font-weight: bold; color: #94a3b8;">اختر عدد المتنافسين:</div>
        <div class="player-count-selector">
            <button class="count-btn active" onclick="selectPlayerCount(2)">2</button>
            <button class="count-btn" onclick="selectPlayerCount(3)">3</button>
            <button class="count-btn" onclick="selectPlayerCount(4)">4</button>
        </div>

        <div class="mode-buttons">
            <button class="btn btn-primary" onclick="startGameSession('ai')">اللعب ضد الذكاء الاصطناعي 🤖</button>
            <button class="btn btn-success" onclick="startGameSession('local')">Pass & Play محلي 👥</button>
        </div>
    </div>

    <!-- 2. GAME LAYOUT -->
    <div id="game-layout">
        <!-- Opponents Bar -->
        <div class="opponents-bar" id="opponents-container"></div>

        <!-- Center Playing Table -->
        <div class="center-table">
            <div class="direction-indicator">
                <span>اتجاه اللعب:</span>
                <span id="dir-arrow">↻ مع عقارب الساعة</span>
            </div>

            <div class="deck-discard-area">
                <!-- Draw Deck -->
                <div class="uno-card deck-back" onclick="drawCardCurrentTurn()">
                    <div class="deck-logo">UNO</div>
                </div>

                <!-- Discard Pile Top Card -->
                <div class="uno-card" id="top-card"></div>
            </div>

            <div class="turn-status-banner" id="turn-banner">في انتظار بدء اللعبة...</div>

            <div class="active-color-badge" id="active-color-badge" style="display: none;">
                <span>اللون النشط الحالي:</span>
                <div class="color-dot" id="active-color-dot"></div>
            </div>
        </div>

        <!-- Player Hand Area -->
        <div class="player-hand-wrapper">
            <button id="btn-uno" onclick="sayUno()">أونو! 🎴</button>
            <div class="cards-fan" id="my-hand-container"></div>
        </div>
    </div>

    <!-- 3. COLOR PICKER MODAL -->
    <div id="color-picker-modal">
        <h2>اختر اللون الجديد 🎨</h2>
        <div class="color-orbs-grid">
            <div class="color-orb red" onclick="submitColorChoice('red')"></div>
            <div class="color-orb blue" onclick="submitColorChoice('blue')"></div>
            <div class="color-orb green" onclick="submitColorChoice('green')"></div>
            <div class="color-orb yellow" onclick="submitColorChoice('yellow')"></div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast"></div>

    <script>
        // --- AUDIO SYNTHESIZER ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'play') {
                    osc.frequency.setValueAtTime(450, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'draw') {
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                    osc.start(); osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'crazy') {
                    const notes = [400, 600, 800, 1200];
                    notes.forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.15);
                        o.connect(g); g.connect(ctx.destination);
                        o.start(ctx.currentTime + i * 0.08);
                        o.stop(ctx.currentTime + i * 0.08 + 0.15);
                    });
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.12 + 0.25);
                        o.connect(g); g.connect(ctx.destination);
                        o.start(ctx.currentTime + i * 0.12);
                        o.stop(ctx.currentTime + i * 0.12 + 0.25);
                    });
                }
            } catch(e) {}
        }

        // --- GAME CONFIG & STATE ---
        let selectedTotalPlayers = 2;
        let gameMode = 'ai'; // 'ai' or 'local'
        let turnIndex = 0;
        let direction = 1; // 1 = clockwise, -1 = counter-clockwise
        let activeColor = null;

        let players = []; // { name, isAi, hand: [], saidUno: false }
        let deck = [];
        let topCard = null;
        let pendingCardIndex = -1;
        let isGameFinished = false;

        const colorsList = ['red', 'blue', 'green', 'yellow'];

        function selectPlayerCount(count) {
            selectedTotalPlayers = count;
            document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- DECK GENERATION ---
        function createCrazyUnoDeck() {
            let cards = [];
            const actionTypes = ['Skip', 'Reverse', '+2'];

            // Numbers & Actions for each color
            colorsList.forEach(c => {
                // 1 zero card per color
                cards.push({ color: c, type: 'number', value: '0' });

                // 2 of 1-9 per color
                for (let i = 1; i <= 9; i++) {
                    cards.push({ color: c, type: 'number', value: String(i) });
                    cards.push({ color: c, type: 'number', value: String(i) });
                }

                // 2 of each Action card per color
                actionTypes.forEach(act => {
                    cards.push({ color: c, type: 'action', value: act });
                    cards.push({ color: c, type: 'action', value: act });
                });
            });

            // 4 Wild Color Change cards
            for (let i = 0; i < 4; i++) {
                cards.push({ color: 'wild', type: 'wild', value: 'Color' });
            }

            // 4 Wild +4 cards
            for (let i = 0; i < 4; i++) {
                cards.push({ color: 'wild', type: 'wild', value: '+4' });
            }

            // 2 CRAZY WHITE CARDS (+5 to ALL other players)
            for (let i = 0; i < 2; i++) {
                cards.push({ color: 'white_crazy', type: 'white_crazy', value: '+5' });
            }

            // Shuffle
            return cards.sort(() => Math.random() - 0.5);
        }

        // --- START GAME SESSION ---
        function startGameSession(mode) {
            gameMode = mode;
            document.getElementById('setup-screen').style.display = 'none';

            // Create Players
            players = [];
            players.push({ name: 'أنت (اللاعب 1)', isAi: false, hand: [], saidUno: false });

            for (let i = 2; i <= selectedTotalPlayers; i++) {
                if (mode === 'ai') {
                    players.push({ name: `الروبوت ${i - 1} 🤖`, isAi: true, hand: [], saidUno: false });
                } else {
                    players.push({ name: `اللاعب ${i} 👤`, isAi: false, hand: [], saidUno: false });
                }
            }

            deck = createCrazyUnoDeck();

            // Deal 7 cards to each player
            players.forEach(p => {
                p.hand = deck.splice(0, 7);
            });

            // Pick initial non-wild top card
            topCard = deck.pop();
            while (topCard.color === 'wild' || topCard.color === 'white_crazy') {
                deck.unshift(topCard);
                topCard = deck.pop();
            }

            activeColor = topCard.color;
            turnIndex = 0;
            direction = 1;
            isGameFinished = false;

            renderUI();
            checkTurnFlow();
        }

        // --- RENDERING CARD UI ---
        function getSymbolMarkup(card) {
            if (card.type === 'number') {
                return `<div class="card-symbol">${card.value}</div>`;
            }
            if (card.value === 'Skip') {
                return `<div class="card-symbol" style="font-size: 2.5rem;">🚫</div>`;
            }
            if (card.value === 'Reverse') {
                return `<div class="card-symbol" style="font-size: 2.5rem;">🔄</div>`;
            }
            if (card.value === '+2') {
                return `<div class="card-symbol" style="font-size: 2rem;">+2</div>`;
            }
            if (card.value === '+4') {
                return `<div class="card-symbol" style="font-size: 2rem;">+4</div>`;
            }
            if (card.value === 'Color') {
                return `<div class="card-symbol" style="font-size: 2.2rem;">🎨</div>`;
            }
            if (card.type === 'white_crazy') {
                return `<div class="card-symbol" style="font-size: 1.8rem; font-weight: 900;">💥 +5</div>`;
            }
            return `<div class="card-symbol">${card.value}</div>`;
        }

        function createCardDOM(card, onClickFn = null) {
            const cardDiv = document.createElement('div');
            cardDiv.className = `uno-card ${card.color}`;

            let cornerText = card.value;
            if (card.value === 'Skip') cornerText = '🚫';
            if (card.value === 'Reverse') cornerText = '🔄';
            if (card.value === 'Color') cornerText = '🎨';
            if (card.value === '+5') cornerText = '💥';

            cardDiv.innerHTML = `
                <div class="card-corner top-left">${cornerText}</div>
                <div class="card-inner-oval">
                    ${getSymbolMarkup(card)}
                </div>
                <div class="card-corner bottom-right">${cornerText}</div>
            `;

            if (onClickFn) cardDiv.onclick = onClickFn;
            return cardDiv;
        }

        function renderUI() {
            // Render Top Discard Card
            const topCardContainer = document.getElementById('top-card');
            topCardContainer.innerHTML = '';
            const topDOM = createCardDOM(topCard);
            topCardContainer.className = topDOM.className;
            topCardContainer.innerHTML = topDOM.innerHTML;

            // Active Color Indicator
            const colorBadge = document.getElementById('active-color-badge');
            const colorDot = document.getElementById('active-color-dot');
            if (activeColor && ['red', 'blue', 'green', 'yellow'].includes(activeColor)) {
                colorBadge.style.display = 'flex';
                colorDot.style.background = `var(--${activeColor}-card)`;
            } else {
                colorBadge.style.display = 'none';
            }

            // Direction Arrow
            document.getElementById('dir-arrow').innerText = direction === 1 ? '↻ مع عقارب الساعة' : '↺ عكس عقارب الساعة';

            // Turn Banner
            const curP = players[turnIndex];
            const turnBanner = document.getElementById('turn-banner');
            turnBanner.innerText = `دور: ${curP.name}`;

            // Render Opponents Bar
            const oppContainer = document.getElementById('opponents-container');
            oppContainer.innerHTML = '';
            players.forEach((p, idx) => {
                if (idx === 0 && gameMode === 'ai') return; // Skip human in top bar in AI mode
                const badge = document.createElement('div');
                badge.className = `opp-card-badge ${idx === turnIndex ? 'active-turn' : ''}`;
                badge.innerHTML = `
                    <div class="opp-avatar">${p.isAi ? '🤖' : '👤'}</div>
                    <div class="opp-info">
                        <div class="opp-name">${p.name}</div>
                        <div class="opp-cards-count">بطاقات: ${p.hand.length} 🎴</div>
                    </div>
                `;
                oppContainer.appendChild(badge);
            });

            // Render Human Player (Player 0) Hand
            const handContainer = document.getElementById('my-hand-container');
            handContainer.innerHTML = '';

            const activePlayer = players[turnIndex];
            const showHandCards = (!activePlayer.isAi || gameMode === 'local') ? activePlayer.hand : players[0].hand;

            showHandCards.forEach((card, idx) => {
                const dom = createCardDOM(card, () => handleHumanCardClick(idx));
                handContainer.appendChild(dom);
            });

            // Pulse UNO button if player has 2 cards and plays 1
            const unoBtn = document.getElementById('btn-uno');
            if (activePlayer.hand.length === 2 && turnIndex === 0) {
                unoBtn.classList.add('pulse-uno');
            } else {
                unoBtn.classList.remove('pulse-uno');
            }
        }

        // --- PLAY CARD VALIDATION ---
        function isValidPlay(card) {
            if (card.color === 'wild' || card.color === 'white_crazy') return true;
            if (card.color === activeColor) return true;
            if (card.value === topCard.value) return true;
            return false;
        }

        // --- TURN & AI FLOW ---
        function checkTurnFlow() {
            if (isGameFinished) return;

            const currentP = players[turnIndex];
            renderUI();

            if (currentP.isAi) {
                setTimeout(() => executeAiTurn(), 1300);
            }
        }

        function handleHumanCardClick(cardIdx) {
            const currentP = players[turnIndex];
            if (currentP.isAi) return showToast('انتظر دور الروبوت!');

            const card = currentP.hand[cardIdx];
            if (!isValidPlay(card)) {
                return showToast('⚠️ بطاقة غير صالحة! يجب مطابقة اللون أو الرقم أو الرمز.');
            }

            // If Wild or White Crazy card -> open color picker modal
            if (card.color === 'wild' || card.color === 'white_crazy') {
                pendingCardIndex = cardIdx;
                document.getElementById('color-picker-modal').style.display = 'flex';
                return;
            }

            playCard(cardIdx, card.color);
        }

        function submitColorChoice(color) {
            document.getElementById('color-picker-modal').style.display = 'none';
            if (pendingCardIndex !== -1) {
                playCard(pendingCardIndex, color);
                pendingCardIndex = -1;
            }
        }

        function drawCardCurrentTurn() {
            if (isGameFinished) return;
            const currentP = players[turnIndex];

            if (deck.length === 0) deck = createCrazyUnoDeck();
            const drawn = deck.pop();
            currentP.hand.push(drawn);
            playSound('draw');

            showToast(`🎴 ${currentP.name} سحب بطاقة من المجموعة`);

            // Next turn
            advanceTurn(1);
            checkTurnFlow();
        }

        function sayUno() {
            const currentP = players[turnIndex];
            currentP.saidUno = true;
            playSound('play');
            showToast('🔥 أونو! بقيت بطاقة واحدة!');
        }

        // --- CORE GAME PLAY CARD EXECUTION ---
        function playCard(cardIdx, chosenColor) {
            const currentP = players[turnIndex];
            const card = currentP.hand.splice(cardIdx, 1)[0];

            topCard = card;
            activeColor = chosenColor || card.color;
            playSound('play');

            // UNO Penalty Check if player has 1 card left and didn't press UNO
            if (currentP.hand.length === 1 && !currentP.saidUno) {
                showToast('⚠️ نسيت قول أونو! عقوبة سحب 2 بطاقة!');
                for(let i=0; i<2; i++) {
                    if (deck.length > 0) currentP.hand.push(deck.pop());
                }
            }
            currentP.saidUno = false; // reset for next turns

            // Check Winner
            if (currentP.hand.length === 0) {
                playSound('win');
                isGameFinished = true;
                showToast(`🏆 تهانينا! فاز ${currentP.name} بالجولة! 🎉`);
                setTimeout(() => {
                    document.getElementById('setup-screen').style.display = 'flex';
                }, 3500);
                return;
            }

            // --- SPECIAL ACTION CARD LOGIC ---
            let skipSteps = 1;

            if (card.value === 'Reverse') {
                direction *= -1;
                showToast('🔄 تم عكس اتجاه اللعب!');
                if (players.length === 2) skipSteps = 2; // In 2-player mode, reverse acts as skip
            } else if (card.value === 'Skip') {
                skipSteps = 2;
                showToast('🚫 تم إلغاء دور اللاعب التالي!');
            } else if (card.value === '+2') {
                skipSteps = 2;
                const victimIndex = getNextPlayerIndex(1);
                const victim = players[victimIndex];
                showToast(`➕2️⃣ ${victim.name} يسحب بطاقتين ويلغى دوره!`);
                for (let i = 0; i < 2; i++) {
                    if (deck.length === 0) deck = createCrazyUnoDeck();
                    victim.hand.push(deck.pop());
                }
            } else if (card.value === '+4') {
                skipSteps = 2;
                const victimIndex = getNextPlayerIndex(1);
                const victim = players[victimIndex];
                showToast(`➕4️⃣ ${victim.name} يسحب 4 بطاقات ويلغى دوره!`);
                for (let i = 0; i < 4; i++) {
                    if (deck.length === 0) deck = createCrazyUnoDeck();
                    victim.hand.push(deck.pop());
                }
            } else if (card.type === 'white_crazy') { // CRAZY WHITE CARD (+5 to ALL other players)
                playSound('crazy');
                showToast('💥 بطاقة أونو المجنونة البيضاء! جميع الخصوم تسحب 5 بطاقات!');
                players.forEach((p, idx) => {
                    if (idx !== turnIndex) { // All other players except the one who played this card
                        for (let i = 0; i < 5; i++) {
                            if (deck.length === 0) deck = createCrazyUnoDeck();
                            p.hand.push(deck.pop());
                        }
                    }
                });
            }

            advanceTurn(skipSteps);
            checkTurnFlow();
        }

        function getNextPlayerIndex(steps) {
            let next = (turnIndex + (steps * direction)) % players.length;
            while (next < 0) next += players.length;
            return next;
        }

        function advanceTurn(steps) {
            turnIndex = getNextPlayerIndex(steps);
        }

        // --- AI BOT INTELLIGENCE ---
        function executeAiTurn() {
            if (isGameFinished) return;
            const ai = players[turnIndex];

            // Find valid playable cards
            let playable = [];
            ai.hand.forEach((card, idx) => {
                if (isValidPlay(card)) playable.push({ card, idx });
            });

            if (playable.length > 0) {
                // Priority: White crazy > +4 > +2 > Skip/Reverse > Color match > Any
                playable.sort((a, b) => {
                    const score = c => {
                        if (c.type === 'white_crazy') return 10;
                        if (c.value === '+4') return 9;
                        if (c.value === '+2') return 8;
                        if (c.value === 'Skip' || c.value === 'Reverse') return 7;
                        if (c.color === activeColor) return 5;
                        return 1;
                    };
                    return score(b.card) - score(a.card);
                });

                const chosen = playable[0];
                let chosenColor = chosen.card.color;

                if (chosen.card.color === 'wild' || chosen.card.color === 'white_crazy') {
                    // Pick AI's most frequent hand color
                    const counts = { red: 0, blue: 0, green: 0, yellow: 0 };
                    ai.hand.forEach(c => { if (counts[c.color] !== undefined) counts[c.color]++; });
                    chosenColor = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
                }

                if (ai.hand.length === 2 && Math.random() > 0.2) {
                    ai.saidUno = true;
                    showToast(`🔥 ${ai.name}: أونو!`);
                }

                playCard(chosen.idx, chosenColor);
            } else {
                // Draw card
                if (deck.length === 0) deck = createCrazyUnoDeck();
                const drawn = deck.pop();
                ai.hand.push(drawn);
                playSound('draw');
                showToast(`🎴 ${ai.name} سحب بطاقة من المجموعة`);

                // Check if drawn card can be played immediately
                if (isValidPlay(drawn)) {
                    setTimeout(() => {
                        let cColor = drawn.color;
                        if (cColor === 'wild' || cColor === 'white_crazy') cColor = 'red';
                        playCard(ai.hand.length - 1, cColor);
                    }, 800);
                } else {
                    advanceTurn(1);
                    checkTurnFlow();
                }
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2400);
        }
    </script>
</body>
