<header class="h-16 border-b border-white/5 bg-slate-950/60 backdrop-blur-xl flex items-center justify-between px-6 z-20 flex-row-reverse shrink-0">
  
  <!-- Right Side (Search & Sidebar toggle) -->
  <div class="flex items-center gap-4 flex-row-reverse">
    
    <!-- Sidebar Toggle -->
    <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" (click)="sidebar.toggleCollapsed()" title="فتح/إغلاق القائمة">
      <svg lucideIcon="menu" class="w-5 h-5"></svg>
    </button>

    <!-- Global Search -->
    <div class="relative hidden md:block">
      <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center justify-center pointer-events-none">
        <svg lucideIcon="search" class="text-slate-500 w-4 h-4"></svg>
      </div>
      <input type="text" placeholder="البحث في نكسوس..." class="w-64 pr-10 pl-4 h-10 bg-white/5 border border-white/10 rounded-xl text-sm font-medium text-white text-right focus:outline-none focus:border-indigo-500/50 focus:bg-white/10 transition-all placeholder:text-slate-500" />
    </div>
  </div>
  
  <!-- Left Side (Wallet, Notifications, Profile) -->
  <div class="flex items-center gap-3 flex-row-reverse">
    
    <!-- Hide Header Toggle -->
    <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" (click)="sidebar.toggleHeader()" title="إخفاء الشريط العلوي">
      <svg lucideIcon="chevron-up" class="w-5 h-5"></svg>
    </button>
    
    <div class="h-6 w-px bg-white/10 mx-1"></div>
    
    <!-- Notifications -->
    <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/5 rounded-xl transition-all relative group" (click)="globalState.clearNotifications()">
      <svg lucideIcon="bell" class="w-5 h-5 group-hover:animate-pulse"></svg>
      @if (globalState.unreadNotificationsCount() > 0) {
        <span class="absolute top-2 left-2.5 h-4 min-w-[16px] px-1 flex items-center justify-center bg-red-500 rounded-full border-2 border-slate-950 text-[10px] font-black text-white shadow-lg shadow-red-500/20 transform scale-100 transition-transform group-hover:scale-110">
          {{ globalState.unreadNotificationsCount() }}
        </span>
      }
    </button>
    
    <div class="h-6 w-px bg-white/10 mx-1"></div>
    
    <!-- Wallet Balance -->
    <button class="h-10 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 flex items-center gap-2.5 text-xs font-bold text-white transition-all flex-row-reverse group cursor-pointer">
      <div class="p-1 rounded-md bg-indigo-500/20 text-indigo-400 group-hover:scale-110 transition-transform">
        <svg lucideIcon="wallet" class="w-3.5 h-3.5"></svg>
      </div>
      <span class="tracking-tight">{{ globalState.formattedBalance() }}</span>
    </button>

    <!-- User Profile -->
    <button class="flex items-center gap-2 hover:opacity-80 transition-opacity ml-2 flex-row-reverse">
      <img [src]="globalState.userProfile().avatarUrl" alt="Profile" class="w-9 h-9 rounded-full border border-white/10 object-cover shadow-sm" />
    </button>

  </div>
</header>
