<a [routerLink]="['/' + (item.route || item.id)]"
   routerLinkActive="bg-white/10 text-white font-bold shadow-lg"
   [routerLinkActiveOptions]="{ exact: !item.route && item.id === '' }"
   class="w-full flex items-center h-12 gap-3 px-3 rounded-xl transition-all relative group overflow-hidden text-slate-300 hover:text-white hover:bg-white/10"
   [ngClass]="{'justify-center': sidebar.isCollapsed()}"
   dir="rtl">
   
  <lucide-icon [name]="item.icon" 
        class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110"
        [ngClass]="iconColorClass"></lucide-icon>

  @if (!sidebar.isCollapsed()) {
    <div class="flex items-center gap-2 flex-1 overflow-hidden relative">
      <span class="font-medium truncate text-sm">{{ item.label }}</span>
      
      @if (item.status === 'BETA') {
        <div class="text-[8px] px-1.5 h-[18px] border border-amber-500/30 text-amber-500 font-black tracking-widest uppercase rounded flex items-center shrink-0">BETA</div>
      }
      
      @if (item.status === 'PRO') {
        <div class="bg-gradient-to-r from-amber-400 to-orange-500 text-black px-1.5 h-[18px] rounded flex items-center font-black text-[8px] uppercase tracking-tighter shrink-0 shadow-sm shadow-orange-500/20">PRO</div>
      }
      
      @if (badgeValue && badgeValue > 0 && !item.status) {
        <div class="bg-indigo-500 text-white h-[18px] px-1.5 flex items-center justify-center text-[10px] rounded font-bold shrink-0">{{ badgeValue }}</div>
      }
    </div>

    <!-- 3-dot context menu trigger on hover -->
    <button class="w-6 h-6 flex items-center justify-center rounded hover:bg-white/10 text-slate-400 hover:text-white opacity-0 group-hover:opacity-100 transition-opacity shrink-0"
            (click)="onContextMenu($event)"
            title="خيارات إضافية">
      <lucide-icon name="more-vertical" class="w-4 h-4"></lucide-icon>
    </button>
  }
</a>

<!-- Context Menu Template -->
<ng-template #contextMenu>
  <div class="w-64 bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-2 animate-in fade-in zoom-in-95" dir="rtl">
    <div class="px-2 py-1.5 text-xs text-indigo-400 opacity-70 mb-1 truncate text-right font-medium">
      التحكم في {{ item.label }}
    </div>
    <div class="h-px bg-white/10 mb-1"></div>
    
    <div class="p-1 space-y-0.5">
      <button class="group w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-all text-slate-300 hover:text-white text-right">
        <lucide-icon name="external-link" class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0"></lucide-icon>
        <span class="flex-1">فتح القسم</span>
      </button>

      <button class="group w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-all text-slate-300 hover:text-white text-right">
        <lucide-icon name="settings-2" class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0"></lucide-icon>
        <span class="flex-1">إعدادات القسم العامة</span>
      </button>
    </div>

    <div class="h-px bg-white/10 my-1"></div>

    <div class="p-1 space-y-0.5">
      <button class="group w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-all text-slate-300 hover:text-white text-right">
        <lucide-icon name="palette" class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0"></lucide-icon>
        <span class="flex-1">تخصيص المظهر والتصميم</span>
      </button>

      <button class="group w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-emerald-500/10 transition-all text-emerald-400 hover:text-emerald-300 text-right">
        <lucide-icon name="plus-circle" class="w-4 h-4 text-emerald-500 group-hover:text-emerald-400 transition-colors shrink-0"></lucide-icon>
        <span class="flex-1 font-medium">إضافة ميزات متقدمة</span>
      </button>
    </div>

    <div class="h-px bg-white/10 my-1"></div>

    <div class="p-1 space-y-0.5">
      <button class="group w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-all text-slate-300 hover:text-white text-right">
        <lucide-icon name="download" class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0"></lucide-icon>
        <span class="flex-1">تفعيل التحميل المسبق</span>
      </button>

      <!-- Submenu Trigger -->
      <div class="relative group/submenu" #submenuTrigger>
        <button (click)="openSubmenu($event, submenuTrigger)" class="w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-all text-slate-300 hover:text-white text-right">
          <lucide-icon name="activity" class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0"></lucide-icon>
          <span class="flex-1">إجراء الضغط المزدوج</span>
          <lucide-icon name="chevron-left" class="w-3.5 h-3.5 text-slate-500 group-hover:text-white transition-colors shrink-0"></lucide-icon>
        </button>
      </div>

<!-- Submenu Template -->
<ng-template #subMenuTemplate>
  <div class="w-48 bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-1.5 z-[1000] animate-in fade-in zoom-in-95 duration-100" dir="rtl">
    <button class="w-full flex items-center gap-2.5 px-2 py-1.5 text-xs rounded-md text-slate-300 hover:text-white hover:bg-white/10 text-right transition-all" (click)="closeSubmenu(); closeContextMenu()">
       <lucide-icon name="external-link" class="w-3.5 h-3.5 text-slate-400 shrink-0"></lucide-icon>
       <span>فتح القسم</span>
    </button>
  </div>
</ng-template>

      <!-- Submenu: تغيير تخطيط الواجهة -->
      <div class="relative group/submenu">
        <button class="group/btn w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-all text-indigo-300 hover:text-indigo-200 text-right">
          <lucide-icon name="box" class="w-4 h-4 text-indigo-400 group-hover/btn:text-indigo-300 transition-colors shrink-0"></lucide-icon>
          <span class="flex-1 font-medium">تغيير تخطيط الواجهة</span>
          <lucide-icon name="chevron-left" class="w-3.5 h-3.5 text-indigo-500 group-hover/btn:text-indigo-300 transition-colors shrink-0"></lucide-icon>
        </button>
        <div class="absolute right-full bottom-0 mr-1.5 w-48 bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-1.5 hidden group-hover/submenu:block z-50 animate-in fade-in zoom-in-95 duration-100">
           <button (click)="sidebar.setPosition('left'); closeContextMenu()" class="group/subbtn w-full flex items-center gap-2.5 px-2 py-1.5 text-xs rounded-md text-slate-300 hover:text-white hover:bg-white/10 text-right transition-all">
             <lucide-icon name="panel-left" class="w-3.5 h-3.5 text-slate-400 group-hover/subbtn:text-white transition-colors shrink-0"></lucide-icon>
             <span class="flex-1">الشريط الأيسر</span>
           </button>
           <button (click)="sidebar.setPosition('right'); closeContextMenu()" class="group/subbtn w-full flex items-center gap-2.5 px-2 py-1.5 text-xs rounded-md text-slate-300 hover:text-white hover:bg-white/10 text-right transition-all">
             <lucide-icon name="panel-right" class="w-3.5 h-3.5 text-slate-400 group-hover/subbtn:text-white transition-colors shrink-0"></lucide-icon>
             <span class="flex-1">الشريط الأيمن</span>
           </button>
           <button (click)="sidebar.setPosition('top'); closeContextMenu()" class="group/subbtn w-full flex items-center gap-2.5 px-2 py-1.5 text-xs rounded-md text-slate-300 hover:text-white hover:bg-white/10 text-right transition-all">
             <lucide-icon name="panel-top" class="w-3.5 h-3.5 text-slate-400 group-hover/subbtn:text-white transition-colors shrink-0"></lucide-icon>
             <span class="flex-1">شريط علوي</span>
           </button>
           <button (click)="sidebar.setPosition('bottom'); closeContextMenu()" class="group/subbtn w-full flex items-center gap-2.5 px-2 py-1.5 text-xs rounded-md text-slate-300 hover:text-white hover:bg-white/10 text-right transition-all">
             <lucide-icon name="panel-bottom" class="w-3.5 h-3.5 text-slate-400 group-hover/subbtn:text-white transition-colors shrink-0"></lucide-icon>
             <span class="flex-1">شريط سفلي</span>
           </button>
           <div class="h-px bg-white/10 my-1"></div>
           <button (click)="sidebar.setPosition('floating'); closeContextMenu()" class="group/subbtn w-full flex items-center gap-2.5 px-2 py-1.5 text-xs rounded-md text-amber-400 hover:text-amber-300 hover:bg-white/10 text-right transition-all">
             <lucide-icon name="orbit" class="w-3.5 h-3.5 text-amber-500 group-hover/subbtn:text-amber-400 transition-colors shrink-0"></lucide-icon>
             <span class="flex-1 font-bold">الوضع العائم</span>
           </button>
        </div>
      </div>
    </div>

    <div class="h-px bg-white/10 my-1"></div>

    <div class="p-1">
      <button (click)="togglePin()"
              class="group w-full flex items-center gap-3 px-2.5 py-2 text-sm rounded-lg hover:bg-white/10 transition-colors text-slate-300 hover:text-white text-right">
        <lucide-icon [name]="isPinned ? 'pin-off' : 'pin'" class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0"></lucide-icon>
        <span class="flex-1">{{ isPinned ? 'إلغاء التثبيت' : 'تثبيت في القائمة' }}</span>
      </button>
    </div>

  </div>
</ng-template>
