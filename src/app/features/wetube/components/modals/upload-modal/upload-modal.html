<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()" dir="rtl">
    
    <!-- Close Button -->
    <button class="close-btn" (click)="onClose()">
      <lucide-icon [img]="X" class="w-4 h-4"></lucide-icon>
    </button>

    <!-- Header -->
    <div class="modal-header">
      <h2 class="title text-white">إرسال عصبي جديد</h2>
      <p class="subtitle">استخدم Si-Neuro Vault للفيديو العام، أو يوتيوب، للمساحات الكبيرة.</p>
    </div>

    <!-- Vault Banner -->
    <div class="vault-banner">
      <button class="vault-btn" (click)="openVault()">
        <lucide-icon [img]="ExternalLink" class="w-3.5 h-3.5"></lucide-icon>
        <span>فتح الخزنة</span>
      </button>
      <div class="vault-info">
        <span class="vault-title text-slate-200">خزنة نكسوس المركزية</span>
        <span class="vault-desc text-slate-500">ارفع ملفك هنا أولاً ثم انسخ الرابط</span>
      </div>
    </div>

    <!-- Source Selector Segmented Buttons -->
    <div class="source-segmented-control">
      <button 
        type="button"
        [class.active]="sourceType === 'vault'" 
        (click)="selectSourceType('vault')"
        class="segment-btn">
        <lucide-icon [img]="HardDrive" class="w-4 h-4"></lucide-icon>
        <span>Vault</span>
      </button>
      <button 
        type="button"
        [class.active]="sourceType === 'youtube'" 
        (click)="selectSourceType('youtube')"
        class="segment-btn">
        <lucide-icon [img]="Link" class="w-4 h-4"></lucide-icon>
        <span>YouTube</span>
      </button>
      <button 
        type="button"
        [class.active]="sourceType === 'local'" 
        (click)="selectSourceType('local')"
        class="segment-btn">
        <lucide-icon [img]="FileVideo" class="w-4 h-4"></lucide-icon>
        <span>محلي</span>
      </button>
    </div>

    <!-- Channel Selector -->
    <div class="channel-selector-container">
      <label class="input-label">قناة +</label>
      <div class="channel-dropdown-trigger" (click)="showChannelDropdown = !showChannelDropdown">
        <lucide-icon [img]="Plus" class="w-4 h-4 text-indigo-400"></lucide-icon>
        <span class="selected-channel-text text-white">{{ selectedChannel }}</span>
      </div>
      
      <!-- Dropdown Items -->
      <div class="channel-dropdown-menu" *ngIf="showChannelDropdown">
        <div 
          *ngFor="let chan of channels" 
          (click)="selectChannel(chan)"
          [class.active]="chan === selectedChannel"
          class="channel-dropdown-item">
          {{ chan }}
        </div>
      </div>
    </div>

    <!-- Input Form Fields -->
    <div class="form-fields">
      <!-- Title Input -->
      <div class="form-group">
        <div class="flex justify-between items-center" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
          <label class="input-label">عنوان الفيديو</label>
          
          <button 
            *ngIf="showFetchButton && !isExtractingTitle" 
            type="button"
            (click)="fetchTitleFromApi()"
            class="text-[10px] text-indigo-400 hover:text-indigo-300 font-bold flex items-center gap-1 bg-indigo-500/10 hover:bg-indigo-500/20 px-2 py-0.5 rounded-md border border-indigo-500/20 transition-all"
            style="font-size: 10px; color: #818cf8; font-weight: bold; cursor: pointer; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); padding: 2px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px;">
            <lucide-icon [img]="Sparkles" class="w-3 h-3 text-indigo-400"></lucide-icon>
            <span>سحب العنوان الفعلي ⚡</span>
          </button>
          
          <span *ngIf="isExtractingTitle" class="text-[10px] text-indigo-400 font-bold animate-pulse" style="font-size: 10px; color: #818cf8; font-weight: bold; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">جاري سحب العنوان...</span>
        </div>
        <input 
          type="text" 
          [(ngModel)]="title" 
          placeholder="...صف موضوع الفيديو"
          class="text-input"
        />
      </div>

      <!-- Source URL Input (hidden if local is selected) -->
      <div class="form-group animate-fade-in" *ngIf="sourceType !== 'local'">
        <label class="input-label">رابط المصدر</label>
        <input 
          type="text" 
          [ngModel]="sourceUrl" 
          (ngModelChange)="onSourceUrlChange($event)"
          placeholder="...رابط فيديو من الخزنة أو اليوتيوب"
          class="text-input font-mono"
        />
      </div>

      <!-- Local File Upload Placeholder (shown if local is selected) -->
      <div class="form-group animate-fade-in" *ngIf="sourceType === 'local'">
        <label class="input-label">ملف الفيديو</label>
        <div class="local-upload-area">
          <lucide-icon [img]="Upload" class="w-8 h-8 text-indigo-400 mb-2"></lucide-icon>
          <span class="text-xs text-slate-300">اسحب وأفلت الملف هنا</span>
          <button type="button" class="local-select-btn">اختر من الجهاز</button>
        </div>
      </div>
    </div>

    <!-- Footer Button -->
    <div class="modal-footer">
      <button class="submit-btn" (click)="onUpload()">
        <lucide-icon [img]="Zap" class="w-4 h-4"></lucide-icon>
        <span>بدء المزامنة</span>
      </button>
    </div>

  </div>
</div>
