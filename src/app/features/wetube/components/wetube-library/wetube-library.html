<div class="library-container">
  <h1>المكتبة</h1>
  <div class="library-grid">
    <div class="library-card">
      <div class="library-icon">
        <lucide-icon [img]="Clock"></lucide-icon>
      </div>
      <div class="library-info">
        <h3>تاريخ المشاهدة</h3>
        <p>{{ historyCount }} عنصر</p>
      </div>
    </div>
    <div class="library-card">
      <div class="library-icon">
        <lucide-icon [img]="Play"></lucide-icon>
      </div>
      <div class="library-info">
        <h3>قوائم التشغيل</h3>
        <p>{{ playlistsCount }} عنصر</p>
      </div>
    </div>
    <div class="library-card">
      <div class="library-icon">
        <lucide-icon [img]="ThumbsUp"></lucide-icon>
      </div>
      <div class="library-info">
        <h3>الفيديوهات المعجب بها</h3>
        <p>{{ likedCount }} عنصر</p>
      </div>
    </div>
  </div>
</div>
