<div class="onboarding-container" dir="rtl">
  <div class="onboarding-card">
    <div class="logo-section">
      <div class="logo-icon">
        <lucide-icon [img]="Sparkles"></lucide-icon>
      </div>
      <h1 class="brand-name">WeTube</h1>
    </div>

    <!-- Step 1: Topic Selection -->
    <div *ngIf="currentStep() === 1" class="step-content">
      <h2 class="step-title">مرحباً بك في WeTube! 👋</h2>
      <p class="step-subtitle">اختر المواضيع اللي تهمك عشان نقدر نقترحلك محتوى يناسبك</p>

      <div class="topics-grid">
        <button
          *ngFor="let topic of suggestedTopics"
          class="topic-chip"
          [class.selected]="isSelected(topic.id)"
          (click)="toggleInterest(topic)">
          <lucide-icon [img]="topic.icon" class="topic-icon"></lucide-icon>
          <span>{{ topic.label }}</span>
        </button>
      </div>

      <p class="hint">اختر 2 أو أكثر للمتابعة</p>

      <button
        class="btn-primary"
        [disabled]="selectedInterests().length < 2"
        (click)="nextStep()">
        متابعة
      </button>
    </div>

    <!-- Step 2: Search for specific interests -->
    <div *ngIf="currentStep() === 2" class="step-content">
      <h2 class="step-title">ابحث عن اهتمامات محددة 🔍</h2>
      <p class="step-subtitle">اكتب كلمة أو موضوع يهمك، وهنعرضلك أفضل النتائج</p>

      <div class="search-input-wrapper">
        <input
          type="text"
          [ngModel]="searchInput()"
          (ngModelChange)="searchInput.set($event)"
          (keyup.enter)="searchAndPreview()"
          placeholder="مثال: تطوير تطبيقات، طبخ إيطالي، رياضة..."
          class="search-input">
        <button class="search-btn" (click)="searchAndPreview()">
          <lucide-icon [img]="Search"></lucide-icon>
        </button>
      </div>

      <div *ngIf="isSearching()" class="loading">جاري البحث...</div>

      <div *ngIf="searchResultsPreview().length > 0" class="results-preview">
        <h3 class="results-title">نتائج مقترحة:</h3>
        <div class="results-list">
          <div *ngFor="let video of searchResultsPreview()" class="result-item">
            <img [src]="video.thumbnail" [alt]="video.title" class="result-thumb">
            <div class="result-info">
              <p class="result-title">{{ video.title }}</p>
              <p class="result-channel">{{ video.author }}</p>
            </div>
          </div>
        </div>
      </div>

      <div class="actions-row">
        <button class="btn-secondary" (click)="prevStep()">رجوع</button>
        <button
          class="btn-primary"
          [disabled]="!canContinue()"
          (click)="nextStep()">
          ابدأ المشاهدة <lucide-icon [img]="TrendingUp" class="btn-icon"></lucide-icon>
        </button>
      </div>
    </div>
  </div>
</div>
