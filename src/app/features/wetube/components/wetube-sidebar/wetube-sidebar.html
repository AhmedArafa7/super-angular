<aside class="wetube-sidebar" [class.collapsed]="collapsed()">
  <button class="collapse-btn" (click)="toggleCollapse()" aria-label="طي القائمة">
    <lucide-icon [img]="Menu" class="icon"></lucide-icon>
  </button>

  <div class="sidebar-content">
    <!-- Search -->
    @if (!collapsed()) {
      <div class="sidebar-search">
        <input type="text" 
               placeholder="بحث في WeTube..." 
               class="search-input"
               (keydown)="onSearchKeydown($event)"
               aria-label="بحث في WeTube">
      </div>
    }

    @for (section of sections(); track section.title) {
      <div class="sidebar-section">
        @if (!collapsed() && section.title) {
          <h4 class="section-title">{{ section.title }}</h4>
        }
        <nav class="menu" [attr.aria-label]="section.title">
          @for (item of section.items; track item.label) {
            <a [routerLink]="item.route"
               class="menu-item"
               [class.active]="item.active()"
               [queryParams]="item.section === 'explore' ? { category: item.label } : null"
               [attr.aria-current]="item.active() ? 'page' : null"
               role="link"
               [title]="item.label">
              <lucide-icon [img]="item.icon" class="icon"></lucide-icon>
              @if (!collapsed()) {
                <span class="menu-label">{{ item.label }}</span>
              }
            </a>
          }
        </nav>
      </div>
    }
  </div>
</aside>

<!-- Mobile overlay -->
@if (showMobileMenu()) {
  <div class="mobile-overlay" (click)="toggleMobileMenu()"></div>
}
