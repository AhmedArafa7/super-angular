<div class="notifications-container">
  <h1>الإشعارات</h1>
  <div class="notifications-list flex-1 w-full max-w-2xl mx-auto flex flex-col items-center justify-center pt-20">
    <div *ngIf="notifications.length === 0" class="empty-state text-center flex flex-col items-center">
      <div class="w-24 h-24 bg-slate-900/50 rounded-full flex items-center justify-center mb-6 border border-white/5">
        <lucide-icon [img]="Bell" class="w-10 h-10 text-slate-500 opacity-50"></lucide-icon>
      </div>
      <h2 class="text-xl font-bold text-white mb-2">لا توجد إشعارات حالياً</h2>
      <p class="text-sm text-slate-400 max-w-sm">الإشعارات المتعلقة بقنواتك المفضلة وتفاعلاتك ستظهر هنا.</p>
    </div>

    <div *ngFor="let notif of notifications" class="notification-item w-full" [class.unread]="!notif.read">
      <div class="notif-icon" [ngSwitch]="notif.type">
        <lucide-icon *ngSwitchCase="'video'" [img]="Video"></lucide-icon>
        <lucide-icon *ngSwitchCase="'comment'" [img]="Bell"></lucide-icon>
        <lucide-icon *ngSwitchCase="'subscribe'" [img]="User"></lucide-icon>
      </div>
      <div class="notif-content">
        <p class="notif-channel">{{ notif.channel }}</p>
        <p class="notif-message">{{ notif.message }}</p>
        <p class="notif-time">{{ notif.time }}</p>
      </div>
      <div *ngIf="!notif.read" class="unread-dot"></div>
    </div>
  </div>
</div>
