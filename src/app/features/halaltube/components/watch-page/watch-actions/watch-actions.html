<div class="actions-container">
  <div class="channel-info">
    <img [src]="getAvatar()" [alt]="channelName" class="w-12 h-12 rounded-full object-cover border border-white/10 shrink-0" />
    <div class="channel-details flex flex-col justify-center">
      <div class="flex items-center gap-1.5">
        <h3 class="font-bold text-white text-base m-0 leading-snug">{{ channelName }}</h3>
        @if (isOfficialCreator) {
          <lucide-icon [img]="CheckCircle" class="w-4 h-4 text-emerald-400 shrink-0" title="منشئ محتوى موثق في halaltube Studio"></lucide-icon>
        } @else if (isYoutube) {
          <span class="px-1.5 py-0.5 rounded-full text-[10px] bg-slate-800/80 text-indigo-300 border border-indigo-500/20 font-medium">مُقترَح</span>
        }
      </div>
      <span class="subscribers text-xs text-slate-400 font-medium truncate block mt-0.5">{{ getSubscriberLabel() }}</span>
    </div>
    <button class="subscribe-btn" [class.subscribed]="isSubscribed" (click)="subscribe.emit()">
      <lucide-icon [img]="Plus"></lucide-icon>
      <span>{{ isSubscribed ? 'مشترك' : 'اشتراك' }}</span>
    </button>
  </div>
  
  <div class="action-buttons">
    <div class="like-dislike-group">
      <button class="action-btn" [class.active]="isLiked" (click)="like.emit()">
        <lucide-icon [img]="ThumbsUp"></lucide-icon>
        <span>{{ likes | number }}</span>
      </button>
      <div class="separator"></div>
      <button class="action-btn" [class.active]="isDisliked" (click)="dislike.emit()">
        <lucide-icon [img]="ThumbsDown"></lucide-icon>
      </button>
    </div>
    
    <button class="action-btn" (click)="share.emit()">
      <lucide-icon [img]="Share2"></lucide-icon>
      <span>مشاركة</span>
    </button>
    
    <button class="action-btn" (click)="download.emit()">
      <lucide-icon [img]="Download"></lucide-icon>
      <span>تحميل</span>
    </button>
    
    <button class="action-btn" (click)="clip.emit()">
      <lucide-icon [img]="Scissors"></lucide-icon>
      <span>قص</span>
    </button>
    
    <button class="action-btn" (click)="save.emit()">
      <span>حفظ</span>
    </button>

    <button class="action-btn transition-all duration-300 border" 
            [ngClass]="audioFilter.isFilterActive() ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 shadow-emerald-500/20' : 'text-amber-400 hover:text-amber-300 border-amber-500/20 bg-amber-500/10'"
            (click)="onRecommendNoMusicClick()" 
            [title]="audioFilter.isFilterActive() ? 'عازل المعازف نشط حالياً - انقر للتبديل أو إلغاء التفعيل' : 'تفعيل عازل المعازف الصوتي واقتراح نزع المعازف شرعياً'">
      <lucide-icon [img]="VolumeX" [class.text-emerald-400]="audioFilter.isFilterActive()" [class.text-amber-400]="!audioFilter.isFilterActive()"></lucide-icon>
      <span class="font-bold text-xs whitespace-nowrap">
        {{ audioFilter.isFilterActive() ? (audioFilter.filterMode() === 'strict_no_music' ? 'عازل فائق 🎙️' : 'عازل المعازف نشط 🎧') : 'أنصح به (بدون معازف)' }}
      </span>
    </button>
    
    <button *ngIf="isYoutube && !isWhitelisted" class="action-btn text-emerald-500 hover:text-emerald-400 border border-emerald-500/20 bg-emerald-500/10" (click)="addToWhitelist.emit()" title="إضافة الفيديو للقائمة البيضاء ليراه الآخرون">
      <lucide-icon [img]="Plus" class="text-emerald-500"></lucide-icon>
      <span class="text-emerald-500 font-bold text-xs whitespace-nowrap">إضافة للقائمة البيضاء</span>
    </button>

    <button class="action-btn text-red-500 hover:text-red-400" (click)="report.emit()" title="إبلاغ عن محتوى حرام أو مخالف">
      <lucide-icon [img]="Flag" class="text-red-500"></lucide-icon>
      <span class="text-red-500 font-bold">حرام</span>
    </button>
  </div>
</div>
