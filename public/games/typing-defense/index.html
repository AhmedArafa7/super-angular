<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حرب الطباعة (Typing Defense)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="start-screen" class="screen active">
        <div class="card">
            <h1>⌨️ حرب الطباعة</h1>
            <p>الكلمات تتساقط من السماء! اكتبها بسرعة لتدمرها قبل أن تصل إلى القاعدة.</p>
            <p class="small-text">يفضل اللعب باستخدام لوحة مفاتيح حقيقية.</p>
            <button id="start-btn" class="btn primary">ابدأ الدفاع</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="hud">
            <div class="score-display">النقاط: <span id="score">0</span></div>
            <div class="lives-display">القاعدة: <span id="lives">❤️❤️❤️</span></div>
        </div>
        
        <div id="game-area">
            <!-- Words will fall here -->
        </div>
        
        <div class="base">
            <div class="typing-area">
                <input type="text" id="type-input" placeholder="اكتب الكلمة هنا..." autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="screen">
        <div class="card">
            <h1 class="danger">تدمرت القاعدة! 💥</h1>
            <h2>الكلمات المدمرة: <span id="final-score">0</span></h2>
            <button id="restart-btn" class="btn primary">دافع مرة أخرى</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
