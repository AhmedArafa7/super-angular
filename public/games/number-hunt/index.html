<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صيد الأرقام - Number Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
    <div id="game-container">
        
        <!-- Setup Screen (Visible initially for Local Play to select player count) -->
        <div id="setup-screen" class="screen active">
            <div class="glass-panel text-center">
                <h1 class="glow-text">صيد الأرقام 🎯</h1>
                <p class="subtitle">ابحث عن الرقم المطلوب واضغط عليه قبل منافسيك!</p>
                
                <div id="local-setup" class="setup-section">
                    <h3>عدد اللاعبين محلياً:</h3>
                    <div class="player-count-buttons">
                        <button class="btn btn-primary" onclick="initLocalGame(2)">لاعبين (2)</button>
                        <button class="btn btn-primary" onclick="initLocalGame(3)">3 لاعبين</button>
                        <button class="btn btn-primary" onclick="initLocalGame(4)">4 لاعبين</button>
                    </div>
                </div>

                <div id="online-setup" class="setup-section hidden">
                    <p class="status-text">انتظار ربط اللاعبين في الغرفة...</p>
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Play Screen -->
        <div id="play-screen" class="screen">
            
            <!-- Local Buzzers Layout Overlay (for Local Play mode) -->
            <div id="buzzers-container" class="hidden">
                <!-- Buzzers will be injected here dynamically by JS -->
            </div>

            <!-- Main Play Area -->
            <div id="play-area">
                <!-- Header Info Bar -->
                <div class="play-header">
                    <div class="target-panel">
                        <span class="label">ابحث عن الرقم:</span>
                        <span id="target-number" class="target-glow">--</span>
                    </div>
                    
                    <div class="room-info hidden" id="room-code-display">
                        <span>غرفة: <strong id="room-id-val">------</strong></span>
                    </div>
                </div>

                <!-- Main Number Grid Container -->
                <div id="grid-container">
                    <div id="number-grid">
                        <!-- Numbers generated by JS -->
                    </div>
                </div>

                <!-- Scores Panel (displays list of players and scores) -->
                <div id="scoreboard">
                    <!-- Scores list generated by JS -->
                </div>
            </div>

            <!-- Active Buzzer / Action Lock Overlay -->
            <div id="buzzed-overlay" class="hidden">
                <div class="buzzed-modal">
                    <h2 id="buzzed-player-name" class="buzzed-title">اللاعب 1 يضغط!</h2>
                    <div id="buzzed-timer" class="timer-circle">3</div>
                    <p class="buzzed-hint font-bold">ابحث عن الرقم المطلوب واضغط عليه الآن!</p>
                </div>
            </div>

        </div>

        <!-- Game Over / Leaderboard Screen -->
        <div id="game-over-screen" class="screen">
            <div class="glass-panel text-center">
                <h1 class="glow-text text-emerald-400">انتهت اللعبة! 🏁</h1>
                <p class="subtitle">النتائج النهائية للمتسابقين</p>
                
                <div id="leaderboard-list">
                    <!-- Leaderboard generated by JS -->
                </div>

                <div class="actions">
                    <button class="btn btn-success" onclick="restartGame()">العب مرة أخرى 🔄</button>
                    <button class="btn btn-danger" onclick="exitGame()">العودة للقائمة 👆</button>
                </div>
            </div>
        </div>

    </div>

    <script src="game.js?v=1"></script>
</body>
</html>
