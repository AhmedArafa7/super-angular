<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Gems 💎🎲✨ - لعبة البورد الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 4 Custom Player Colors: Mauve, Pink, Black, Brown */
            --mauve: #a855f7;
            --mauve-dark: #7e22ce;
            --pink: #ec4899;
            --pink-dark: #be185d;
            --black: #334155;
            --black-dark: #0f172a;
            --brown: #8b4513;
            --brown-dark: #5c2c06;

            /* Handcrafted Slender Metallic Gold Palette */
            --gold-real: #d4af37;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;

            /* Slot Mapping */
            --red: var(--mauve);
            --red-dark: var(--mauve-dark);
            --green: var(--pink);
            --green-dark: var(--pink-dark);
            --yellow: var(--black);
            --yellow-dark: var(--black-dark);
            --blue: var(--brown);
            --blue-dark: var(--brown-dark);

            --bg-dark: #080112;
            --card-bg: rgba(15, 23, 42, 0.88);
            --cell-bg: #151d30;
            --cell-border: rgba(255, 255, 255, 0.08);
            --path-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            background: #080112;
            color: white;
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- GAMEPLAY WALLPAPER BACKGROUND --- */
        #game-bg-wallpaper {
            position: fixed;
            inset: 0;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            opacity: 0.95;
            filter: brightness(0.85) contrast(1.15);
            z-index: 0;
            pointer-events: none;
        }

        #floating-dice-bg {
            position: fixed;
            inset: 0;
            font-size: 3.5rem;
            color: rgba(168, 85, 247, 0.2);
            letter-spacing: 65px;
            word-spacing: 110px;
            line-height: 160px;
            pointer-events: none;
            user-select: none;
            animation: floatingLudoTokens 22s linear infinite;
            z-index: 1;
        }

        @keyframes floatingLudoTokens {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-35px) rotate(4deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* --- RICH THEMATIC SETUP MODAL --- */
        #setup-screen {
            position: absolute;
            inset: 0;
            background: rgba(8, 1, 18, 0.95);
            backdrop-filter: blur(18px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 25px;
        }

        #setup-screen h1 {
            font-size: 4.2rem;
            font-weight: 900;
            color: var(--gold-real);
            margin: 0.5rem 0 0.5rem 0;
            text-shadow: 0 4px 30px rgba(212, 175, 55, 0.6);
            letter-spacing: 3px;
        }

        /* PAWNS PREVIEW STRIP ON SETUP SCREEN */
        .pawns-preview-strip {
            display: flex;
            gap: 0.8rem;
            margin: 1.2rem 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pawn-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        /* LOCAL PLAYER COUNT SELECTOR */
        .player-count-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .count-btn {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 2px solid var(--gold-real);
            padding: 0.85rem 1.8rem;
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Tajawal', sans-serif;
        }

        .count-btn:hover {
            transform: translateY(-2px) scale(1.05);
            background: rgba(212, 175, 55, 0.2);
        }

        .count-btn.active {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            border-color: #fcf6ba;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
        }

        .btn {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: white;
            border: 2px solid var(--gold-real);
            padding: 1.15rem 3.5rem;
            border-radius: 100px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6);
            font-family: 'Tajawal', sans-serif;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 14px 40px rgba(168, 85, 247, 0.85);
        }
        .btn:disabled {
            background: #334155;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }

        /* --- MAIN GAME CONTAINER --- */
        #game-container {
            direction: ltr;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-areas:
                "mauve-player   board  pink-player"
                "brown-player   board  black-player";
            grid-template-columns: 215px auto 215px;
            grid-template-rows: 1fr 1fr;
            gap: 1.2rem;
            align-items: center;
            justify-content: center;
            max-width: 99vw;
            max-height: 99vh;
            padding: 0.6rem;
            box-sizing: border-box;
        }

        /* CORNER PLAYER CARDS */
        .corner-card {
            direction: rtl;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            border: 1.5px solid var(--gold-real);
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            opacity: 0.88;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .corner-card.active {
            opacity: 1;
            transform: scale(1.05);
            border-color: currentColor;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 25px currentColor;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            width: 100%;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ccc;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
        }
        .info h3 { margin: 0; font-size: 1.05rem; font-weight: 900; }
        .info p { margin: 2px 0 0 0; font-size: 0.82rem; opacity: 0.85; font-weight: bold; }

        .dice-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* --- TRUE 3D CUBE DICE WITH STRICT ACTIVE PLAYER CLICKING --- */
        .mini-dice-3d-scene {
            width: 68px;
            height: 68px;
            perspective: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: none;
        }

        .corner-card.active .mini-dice-3d-scene {
            pointer-events: auto;
            animation: scenePulse 1s infinite alternate;
        }

        @keyframes scenePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(212, 175, 55, 0.8)); }
            100% { transform: scale(1.12); filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.95)); }
        }

        .cube-3d {
            width: 58px;
            height: 58px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.2, 0.85, 0.32, 1.2);
            opacity: 1 !important;
        }

        .face {
            position: absolute;
            width: 58px;
            height: 58px;
            background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 60%, #e2e8f0 100%);
            border: 2px solid var(--gold-real);
            border-radius: 14px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.9), 0 6px 15px rgba(0,0,0,0.4);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 7px;
            box-sizing: border-box;
            backface-visibility: hidden;
        }

        /* 3D Cube Face Transforms (translateZ = 29px) */
        .face.front  { transform: rotateY(0deg) translateZ(29px); }
        .face.back   { transform: rotateY(180deg) translateZ(29px); }
        .face.right  { transform: rotateY(90deg) translateZ(29px); }
        .face.left   { transform: rotateY(-90deg) translateZ(29px); }
        .face.top    { transform: rotateX(90deg) translateZ(29px); }
        .face.bottom { transform: rotateX(-90deg) translateZ(29px); }

        /* 3D Rotation for Dice Values 1..6 */
        .cube-3d[data-value="1"] { transform: rotateX(0deg) rotateY(0deg); }
        .cube-3d[data-value="6"] { transform: rotateY(180deg); }
        .cube-3d[data-value="2"] { transform: rotateY(-90deg); }
        .cube-3d[data-value="5"] { transform: rotateY(90deg); }
        .cube-3d[data-value="3"] { transform: rotateX(-90deg); }
        .cube-3d[data-value="4"] { transform: rotateX(90deg); }

        /* Tumbling 3D Roll Animation */
        .cube-3d.rolling {
            animation: rollCube3D 0.65s linear infinite !important;
        }

        @keyframes rollCube3D {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            25% { transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
            50% { transform: rotateX(360deg) rotateY(180deg) rotateZ(90deg); }
            75% { transform: rotateX(540deg) rotateY(270deg) rotateZ(135deg); }
            100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg); }
        }

        /* 3D Face Dots */
        .dot {
            background: #0f172a;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            margin: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .dot.center    { grid-area: 2 / 2; }
        .dot.top-left  { grid-area: 1 / 1; }
        .dot.top-right { grid-area: 1 / 3; }
        .dot.mid-left  { grid-area: 2 / 1; }
        .dot.mid-right { grid-area: 2 / 3; }
        .dot.bot-left  { grid-area: 3 / 1; }
        .dot.bot-right { grid-area: 3 / 3; }

        /* 10-SECOND AUTO ROLL TIMER BADGE */
        .timer-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-size: 0.85rem;
            font-weight: 900;
            padding: 3px 9px;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
            display: none;
            z-index: 20;
            animation: badgePulse 0.5s infinite alternate;
        }

        @keyframes badgePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* --- LUXURIOUS BOARD WITH SLENDER HANDCRAFTED REAL GOLD BORDER --- */
        .board-wrapper {
            direction: ltr;
            position: relative;
            width: min(84vw, 75vh);
            height: min(84vw, 75vh);
            background: #0f172a;
            border-radius: 36px;
            box-shadow: 0 35px 100px rgba(0,0,0,0.95), 0 0 35px rgba(212, 175, 55, 0.35), inset 0 0 25px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 3px solid var(--gold-real);
            padding: 4px;
        }

        #ludo-grid {
            direction: ltr;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100%;
            height: 100%;
        }

        .cell {
            border: 1px solid rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MATTE UNPOLISHED POLYMER / CLOTH TEXTURE PATH TILES */
        .bg-path {
            background: repeating-linear-gradient(
                45deg,
                #f8fafc,
                #f8fafc 4px,
                #f1f5f9 4px,
                #f1f5f9 8px
            ) !important;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.12) !important;
        }

        /* 4 Player Colors (Mauve, Pink, Black, Brown) */
        .bg-red { background: linear-gradient(145deg, #a855f7, #7e22ce) !important; }
        .bg-green { background: linear-gradient(145deg, #ec4899, #be185d) !important; }
        .bg-yellow { background: linear-gradient(145deg, #334155, #1e293b) !important; }
        .bg-blue { background: linear-gradient(145deg, #8b4513, #5c2c06) !important; }

        .safe-zone {
            background: linear-gradient(145deg, #fef08a, #d4af37) !important;
            border: 1px solid #c5a059 !important;
        }
        .safe-zone::after {
            content: '⭐';
            font-size: clamp(14px, 2.2vw, 24px);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.4));
            animation: starGlow 2s ease-in-out infinite;
        }
        @keyframes starGlow {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        /* 3D HOME BASES WITH SLENDER REAL METALLIC GOLD BORDERS */
        .home-base {
            position: absolute;
            width: 40%;
            height: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold-real) !important;
            box-shadow: inset 0 4px 14px rgba(0,0,0,0.4), 0 0 10px rgba(212, 175, 55, 0.3) !important;
        }
        .home-base.red { top: 0; left: 0; background: linear-gradient(145deg, #a855f7, #6b21a8); border-radius: 24px 0 0 0; }
        .home-base.green { top: 0; right: 0; background: linear-gradient(145deg, #ec4899, #9d174d); border-radius: 0 24px 0 0; }
        .home-base.yellow { bottom: 0; right: 0; background: linear-gradient(145deg, #334155, #0f172a); border-radius: 0 0 24px 0; }
        .home-base.blue { bottom: 0; left: 0; background: linear-gradient(145deg, #8b4513, #3b1903); border-radius: 0 0 0 24px; }

        .home-inner {
            width: 74%;
            height: 74%;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border-radius: 26px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 12%;
            gap: 12%;
            border: 1.5px solid #c5a059;
            box-shadow: inset 0 6px 14px rgba(0,0,0,0.35), 0 8px 18px rgba(0,0,0,0.3);
        }

        .home-spot {
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.45) 100%);
            border-radius: 50%;
            position: relative;
            border: 1.5px solid var(--gold-real);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* 3D Center Victory Square with Slender Real Gold Border */
        .center-home {
            position: absolute;
            top: 40%;
            left: 40%;
            width: 20%;
            height: 20%;
            background: conic-gradient(
                from 45deg,
                var(--black) 0deg 90deg,   /* Right -> Black */
                var(--brown) 90deg 180deg,  /* Bottom -> Brown */
                var(--mauve) 180deg 270deg, /* Left -> Mauve */
                var(--pink) 270deg 360deg  /* Top -> Pink */
            );
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold-real);
            box-shadow: inset 0 0 16px rgba(0,0,0,0.6), 0 0 15px rgba(212, 175, 55, 0.35);
            z-index: 5;
        }

        .center-home::before {
            content: '🏆';
            font-size: clamp(18px, 3vw, 34px);
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
            animation: trophyFloat 3s ease-in-out infinite;
        }

        @keyframes trophyFloat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        /* --- 3D ROUND GEM PAWNS (Four Gems) --- */
        #tokens-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        .token {
            position: absolute;
            width: calc(100% / 15 * 0.78);
            height: calc(100% / 15 * 0.78);
            border-radius: 50%;
            border: none !important;
            outline: none !important;
            transform: translate(-50%, -50%);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
        }

        /* Spherical glossy highlight (top-left glare) */
        .token::before {
            content: '';
            position: absolute;
            top: 7%;
            left: 13%;
            width: 36%;
            height: 27%;
            border-radius: 50%;
            background: radial-gradient(ellipse at 40% 40%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.2) 65%, transparent 100%);
            transform: rotate(-22deg);
            pointer-events: none;
            z-index: 2;
        }

        /* 3D sphere shading + inner refraction glow */
        .token::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 72% 82%, rgba(255, 255, 255, 0.3) 0%, transparent 55%),
                radial-gradient(circle at 50% 35%, transparent 42%, rgba(0, 0, 0, 0.28) 76%, rgba(0, 0, 0, 0.6) 100%);
            box-shadow:
                inset -8px -10px 16px rgba(0, 0, 0, 0.55),
                inset 5px 7px 11px rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .token:hover {
            transform: translate(-50%, -68%) scale(1.28);
            z-index: 30;
        }

        .token.highlight {
            animation: gemPulse 0.9s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes gemPulse {
            0% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.9), 0 0 22px currentColor; }
            100% { transform: translate(-50%, -70%) scale(1.32); box-shadow: 0 0 0 16px rgba(212, 175, 55, 0), 0 0 35px currentColor, 0 18px 36px rgba(0, 0, 0, 0.9); }
        }

        /* 1. Amethyst (Mauve) round gem */
        .token.red {
            background: radial-gradient(circle at 32% 28%, #f3e8ff 0%, #c084fc 28%, #a855f7 52%, #7e22ce 76%, #4c1d95 100%);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.85), 0 0 18px rgba(168, 85, 247, 0.7);
        }

        /* 2. Rose Quartz (Pink) round gem */
        .token.green {
            background: radial-gradient(circle at 32% 28%, #fdf2f8 0%, #f9a8d4 28%, #ec4899 52%, #be185d 76%, #831843 100%);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.85), 0 0 18px rgba(236, 72, 153, 0.7);
        }

        /* 3. Black Obsidian (Slate) round gem */
        .token.yellow {
            background: radial-gradient(circle at 32% 28%, #e2e8f0 0%, #64748b 28%, #334155 52%, #0f172a 76%, #020617 100%);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.9), 0 0 18px rgba(148, 163, 184, 0.55);
        }

        /* 4. Tiger Eye (Brown) round gem */
        .token.blue {
            background: radial-gradient(circle at 32% 28%, #fef3c7 0%, #f59e0b 28%, #b45309 52%, #78350f 76%, #451a03 100%);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.85), 0 0 18px rgba(180, 83, 9, 0.7);
        }

        /* TOAST & NOTIFICATIONS */
        .toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            color: var(--gold-real);
            border: 1.5px solid var(--gold-real);
            padding: 1rem 2.4rem;
            border-radius: 100px;
            font-size: 1.35rem;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 200;
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
        }

        .event-text {
            position: absolute;
            color: white;
            font-weight: 900;
            font-size: 2.4rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.95);
            pointer-events: none;
            animation: floatUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-25px) scale(1.25); opacity: 1; }
            80% { transform: translateY(-45px) scale(1); opacity: 1; }
            100% { transform: translateY(-65px) scale(0.8); opacity: 0; }
        }

        @media (max-width: 900px) {
            #game-container {
                grid-template-areas:
                    "mauve-player   pink-player"
                    "board          board"
                    "brown-player   black-player";
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto;
            }
            .board-wrapper { width: min(92vw, 55vh); height: min(92vw, 55vh); grid-area: board; }
        }
    </style>
</head>
<body>

    <!-- GAMEPLAY WALLPAPER BACKGROUND -->
    <div id="game-bg-wallpaper"></div>
    <div id="floating-dice-bg">🎲 &nbsp; ⭐ &nbsp; 🟣 &nbsp; 🌸 &nbsp; ⬛ &nbsp; 🟤 &nbsp; 🏆</div>

    <div id="setup-screen">
        <div style="font-size: 3.5rem; margin-bottom: 0.2rem; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8));">💎 🎲 ✨</div>
        <h1>Four Gems 💎</h1>
        <p id="setup-status" style="font-size: 1.25rem; margin-bottom: 0.8rem; color: #cbd5e1; font-weight: bold;">اختر عدد اللاعبين في الجلسة المحلية:</p>
        
        <!-- 4 Gemstone Pawns Preview Badges -->
        <div class="pawns-preview-strip">
            <div class="pawn-badge" style="background: rgba(168, 85, 247, 0.25); border: 1.5px solid #a855f7; color: #e9d5ff;">🟣 اللاعب الموف</div>
            <div class="pawn-badge" style="background: rgba(236, 72, 153, 0.25); border: 1.5px solid #ec4899; color: #fbcfe8;">🌸 اللاعب البينك</div>
            <div class="pawn-badge" style="background: rgba(51, 65, 85, 0.5); border: 1.5px solid #94a3b8; color: #cbd5e1;">⬛ اللاعب الأسود</div>

        </div>

        <div class="player-count-selector">
            <button class="count-btn" onclick="selectPlayerCount(2, this)">2 لاعبين 👥</button>
            <button class="count-btn" onclick="selectPlayerCount(3, this)">3 لاعبين 👥👤</button>
            <button class="count-btn active" onclick="selectPlayerCount(4, this)">4 لاعبين 👥👥</button>
        </div>

        <button id="start-btn" class="btn" onclick="startGame()" style="margin-top: 1.2rem;">ابدأ اللعبة 🚀</button>

                </div>
            </div>
            <div class="dice-wrapper">
                <div class="mini-dice-3d-scene" onclick="rollDice(0)">
                    <div class="cube-3d" data-value="6">
                        <div class="face front"><div class="dot center"></div></div>
                        <div class="face back">
                            <div class="dot top-left"></div><div class="dot top-right"></div>

                        <div class="face bottom">

                            <div class="dot bot-left"></div><div class="dot bot-right"></div>
                        </div>
                    </div>
                </div>
                <div class="timer-badge">10ث</div>
            </div>
        </div>

        <!-- Board Wrapper -->
        <div class="board-wrapper" style="grid-area: board;">
            <div id="ludo-grid"></div>
            
            <div class="home-base red"><div class="home-inner" id="home-red"></div></div>
            <div class="home-base green"><div class="home-inner" id="home-green"></div></div>
            <div class="home-base yellow"><div class="home-inner" id="home-yellow"></div></div>
            <div class="home-base blue"><div class="home-inner" id="home-blue"></div></div>
            
            <div class="center-home"></div>
            
            <div id="tokens-layer"></div>
        </div>

        <div id="corner-player-3" class="corner-card" style="grid-area: brown-player; color: var(--brown);">

    </div>

    <script src="game.js"></script>
</body>
