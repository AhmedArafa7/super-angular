<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Party</title>
    <style>
        :root {
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #eab308;
            --blue: #3b82f6;
            --bg: #1e293b;
            --grid-line: #cbd5e1;
            --path-bg: #f8fafc;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #setup-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #setup-screen h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--yellow);
            margin: 0 0 1rem 0;
            text-shadow: 0 4px 20px rgba(234, 179, 8, 0.4);
        }

        .btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 100px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #2563eb;
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        #game-container {
            display: flex;
            gap: 2rem;
            align-items: center;
            max-width: 100vw;
            max-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }

        .board-wrapper {
            position: relative;
            width: min(90vw, 80vh);
            height: min(90vw, 80vh);
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid #0f172a;
        }

        #ludo-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100%;
            height: 100%;
        }

        .cell {
            border: 1px solid rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Colors for cells */
        .bg-red { background-color: var(--red) !important; }
        .bg-green { background-color: var(--green) !important; }
        .bg-yellow { background-color: var(--yellow) !important; }
        .bg-blue { background-color: var(--blue) !important; }
        .bg-path { background-color: var(--path-bg); }

        .safe-zone::after {
            content: '⭐';
            font-size: clamp(10px, 2vw, 20px);
            opacity: 0.5;
        }

        /* Base Home Areas */
        .home-base {
            position: absolute;
            width: 40%;
            height: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-base.red { top: 0; left: 0; background: var(--red); }
        .home-base.green { top: 0; right: 0; background: var(--green); }
        .home-base.yellow { bottom: 0; right: 0; background: var(--yellow); }
        .home-base.blue { bottom: 0; left: 0; background: var(--blue); }

        .home-inner {
            width: 70%;
            height: 70%;
            background: white;
            border-radius: 15%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 10%;
            gap: 10%;
        }

        .home-spot {
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            position: relative;
        }

        .center-home {
            position: absolute;
            top: 40%;
            left: 40%;
            width: 20%;
            height: 20%;
            background: conic-gradient(
                var(--red) 0deg 90deg, 
                var(--blue) 90deg 180deg, 
                var(--yellow) 180deg 270deg, 
                var(--green) 270deg 360deg
            );
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            border: 1px solid rgba(0,0,0,0.2);
        }

        .center-home::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top right, transparent 49%, rgba(0,0,0,0.3) 50%, transparent 51%),
                        linear-gradient(to bottom right, transparent 49%, rgba(0,0,0,0.3) 50%, transparent 51%);
        }

        /* Tokens */
        #tokens-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .token {
            position: absolute;
            width: calc(100% / 15 * 0.7);
            height: calc(100% / 15 * 0.7);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 -3px 6px rgba(0,0,0,0.2);
            transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
        }
        .token:hover {
            transform: translate(-50%, -60%) scale(1.1);
            z-index: 20;
        }
        .token.highlight {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .token.red { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626); }
        .token.green { background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a); }
        .token.yellow { background: radial-gradient(circle at 30% 30%, #fde047, #ca8a04); }
        .token.blue { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); }

        /* UI Panel */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 250px;
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            border: 2px solid transparent;
            opacity: 0.5;
            transition: 0.3s;
        }
        .player-card.active {
            opacity: 1;
            border-color: currentColor;
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ccc;
        }
        .info h3 { margin: 0; font-size: 1rem; }
        .info p { margin: 0; font-size: 0.8rem; opacity: 0.7; }

        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-top: auto;
        }

        #dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3), inset 0 -4px 10px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        #dice:hover:not(.disabled) {
            transform: scale(1.05) rotate(5deg);
        }
        #dice.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #dice.rolling {
            animation: roll 0.5s linear infinite;
        }
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1.1); }
        }

        .dot {
            background: #1e293b;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            margin: auto;
            display: none;
        }
        /* Dice faces */
        #dice[data-value="1"] .dot:nth-child(5) { display: block; }
        #dice[data-value="2"] .dot:nth-child(1), #dice[data-value="2"] .dot:nth-child(9) { display: block; }
        #dice[data-value="3"] .dot:nth-child(1), #dice[data-value="3"] .dot:nth-child(5), #dice[data-value="3"] .dot:nth-child(9) { display: block; }
        #dice[data-value="4"] .dot:nth-child(1), #dice[data-value="4"] .dot:nth-child(3), #dice[data-value="4"] .dot:nth-child(7), #dice[data-value="4"] .dot:nth-child(9) { display: block; }
        #dice[data-value="5"] .dot:nth-child(1), #dice[data-value="5"] .dot:nth-child(3), #dice[data-value="5"] .dot:nth-child(5), #dice[data-value="5"] .dot:nth-child(7), #dice[data-value="5"] .dot:nth-child(9) { display: block; }
        #dice[data-value="6"] .dot:nth-child(1), #dice[data-value="6"] .dot:nth-child(3), #dice[data-value="6"] .dot:nth-child(4), #dice[data-value="6"] .dot:nth-child(6), #dice[data-value="6"] .dot:nth-child(7), #dice[data-value="6"] .dot:nth-child(9) { display: block; }

        .toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 1rem 2rem;
            border-radius: 100px;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: 0.3s;
            z-index: 200;
        }

        /* Notifications layer */
        .event-text {
            position: absolute;
            color: white;
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            80% { transform: translateY(-40px) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.8); opacity: 0; }
        }

        @media (max-width: 768px) {
            #game-container { flex-direction: column; }
            .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 1rem; gap: 0.5rem; }
            .player-card { flex: 1 1 45%; padding: 0.5rem; }
            .dice-container { position: absolute; bottom: 2rem; right: 2rem; z-index: 30; }
            #dice { width: 60px; height: 60px; }
            .dot { width: 10px; height: 10px; }
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>يلا لودو 🎲</h1>
        <p id="setup-status" style="font-size: 1.2rem; margin-bottom: 2rem; color: #cbd5e1;">بانتظار انضمام اللاعبين (1/4)...</p>
        <button id="start-btn" class="btn" onclick="startGame()" disabled>ابدأ اللعبة</button>
    </div>

    <div id="game-container">
        <!-- Players Panel (Left side in LTR, Right side in RTL) -->
        <div class="side-panel">
            <div id="card-red" class="player-card" style="color: var(--red);">
                <div class="avatar" style="background: var(--red);"></div>
                <div class="info">
                    <h3>اللاعب الأحمر</h3>
                    <p>في الانتظار</p>
                </div>
            </div>
            <div id="card-green" class="player-card" style="color: var(--green);">
                <div class="avatar" style="background: var(--green);"></div>
                <div class="info">
                    <h3>اللاعب الأخضر</h3>
                    <p>في الانتظار</p>
                </div>
            </div>
            <div id="card-yellow" class="player-card" style="color: var(--yellow);">
                <div class="avatar" style="background: var(--yellow);"></div>
                <div class="info">
                    <h3>اللاعب الأصفر</h3>
                    <p>في الانتظار</p>
                </div>
            </div>
            <div id="card-blue" class="player-card" style="color: var(--blue);">
                <div class="avatar" style="background: var(--blue);"></div>
                <div class="info">
                    <h3>اللاعب الأزرق</h3>
                    <p>في الانتظار</p>
                </div>
            </div>
        </div>

        <div class="board-wrapper">
            <div id="ludo-grid"></div>
            
            <div class="home-base red"><div class="home-inner" id="home-red"></div></div>
            <div class="home-base green"><div class="home-inner" id="home-green"></div></div>
            <div class="home-base yellow"><div class="home-inner" id="home-yellow"></div></div>
            <div class="home-base blue"><div class="home-inner" id="home-blue"></div></div>
            
            <div class="center-home"></div>
            
            <div id="tokens-layer"></div>
        </div>

        <div class="dice-container">
            <div id="dice" data-value="6" onclick="rollDice()">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div id="turn-indicator" style="font-weight: bold; font-size: 1.2rem; color: #cbd5e1;">دور الأحمر</div>
        </div>
    </div>

    <div id="toast" class="toast">رسالة</div>

    <script src="game.js"></script>
</body>
</html>
