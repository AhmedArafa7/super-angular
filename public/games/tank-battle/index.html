<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle</title>
    <link rel="stylesheet" href="styles.css">
    <!-- PeerJS for P2P Networking -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TANK BATTLE</h1>
            <p id="status-text">Select Game Mode</p>
        </header>

        <div id="mode-selection" class="menu-section">
            <button class="mode-btn" data-mode="local">Local Play</button>
            <button class="mode-btn" data-mode="p2p">P2P Multiplayer (Free)</button>
            <button class="mode-btn disabled" disabled title="Requires Backend Setup">Dedicated Server (Pro)</button>
        </div>

        <div id="local-menu" class="menu-section hidden">
            <button class="player-btn" data-players="1" data-ai="1">1 vs 1 Bot</button>
            <button class="player-btn" data-players="1" data-ai="3">1 vs 3 Bots</button>
            <button class="player-btn" data-players="2" data-ai="0">2 Players</button>
            <button class="player-btn" data-players="3" data-ai="0">3 Players</button>
            <button class="player-btn" data-players="4" data-ai="0">4 Players</button>
            <button class="back-to-modes-btn mt-10">Back</button>
        </div>

        <div id="p2p-menu" class="menu-section hidden">
            <div class="p2p-actions">
                <div class="p2p-card">
                    <h3>Host Game</h3>
                    <button id="create-room-btn">Create Room</button>
                    <div id="room-info" class="hidden">
                        <p>Share this Room ID with your friend:</p>
                        <code id="room-id-display">Generating...</code>
                        <p class="waiting-text">Waiting for player 2 to join...</p>
                    </div>
                </div>
                
                <div class="p2p-card">
                    <h3>Join Game</h3>
                    <input type="text" id="join-room-id" placeholder="Enter Room ID here" />
                    <button id="join-room-btn">Connect & Play</button>
                    <p id="join-error" class="error-text hidden"></p>
                </div>
            </div>
            <button class="back-to-modes-btn mt-10">Back</button>
        </div>

        <div id="game-container" class="hidden">
            <div id="game-wrapper" style="position: relative; width: 100%; max-width: 800px; margin: 0 auto;">
                <canvas id="game-canvas" width="800" height="600"></canvas>
                
                <!-- P1 Controls (Bottom Left) -->
                <div id="controls-p1" class="mobile-controls p1-controls hidden">
                    <div class="dpad">
                        <button id="btn-up-1" class="dpad-btn up p1-btn">▲</button>
                        <button id="btn-left-1" class="dpad-btn left p1-btn">◀</button>
                        <button id="btn-right-1" class="dpad-btn right p1-btn">▶</button>
                        <button id="btn-down-1" class="dpad-btn down p1-btn">▼</button>
                    </div>
                    <div class="action-buttons">
                        <button id="btn-shoot-1" class="action-btn p1-btn">FIRE</button>
                    </div>
                </div>

                <!-- P2 Controls (Bottom Right) -->
                <div id="controls-p2" class="mobile-controls p2-controls hidden">
                    <div class="dpad">
                        <button id="btn-up-2" class="dpad-btn up p2-btn">▲</button>
                        <button id="btn-left-2" class="dpad-btn left p2-btn">◀</button>
                        <button id="btn-right-2" class="dpad-btn right p2-btn">▶</button>
                        <button id="btn-down-2" class="dpad-btn down p2-btn">▼</button>
                    </div>
                    <div class="action-buttons">
                        <button id="btn-shoot-2" class="action-btn p2-btn">FIRE</button>
                    </div>
                </div>

                <!-- P3 Controls (Top Left) -->
                <div id="controls-p3" class="mobile-controls p3-controls hidden">
                    <div class="dpad">
                        <button id="btn-up-3" class="dpad-btn up p3-btn">▲</button>
                        <button id="btn-left-3" class="dpad-btn left p3-btn">◀</button>
                        <button id="btn-right-3" class="dpad-btn right p3-btn">▶</button>
                        <button id="btn-down-3" class="dpad-btn down p3-btn">▼</button>
                    </div>
                    <div class="action-buttons">
                        <button id="btn-shoot-3" class="action-btn p3-btn">FIRE</button>
                    </div>
                </div>

                <!-- P4 Controls (Top Right) -->
                <div id="controls-p4" class="mobile-controls p4-controls hidden">
                    <div class="dpad">
                        <button id="btn-up-4" class="dpad-btn up p4-btn">▲</button>
                        <button id="btn-left-4" class="dpad-btn left p4-btn">◀</button>
                        <button id="btn-right-4" class="dpad-btn right p4-btn">▶</button>
                        <button id="btn-down-4" class="dpad-btn down p4-btn">▼</button>
                    </div>
                    <div class="action-buttons">
                        <button id="btn-shoot-4" class="action-btn p4-btn">FIRE</button>
                    </div>
                </div>
            </div>
            
            <div id="controls-help">
                <div class="p1">P1 (Blue): W A S D | Shoot: Space</div>
                <div class="p2 hidden">P2 (Red): Arrows | Shoot: Enter</div>
                <div class="p3 hidden">P3 (Green): I J K L | Shoot: P</div>
                <div class="p4 hidden">P4 (Yellow): Num 8 4 5 6 | Shoot: Num 0</div>
            </div>

            <div class="controls-buttons">
                <button id="restart-btn" class="hidden">Play Again</button>
                <button id="menu-btn" class="hidden">Main Menu</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
